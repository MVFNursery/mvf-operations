<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2d5016">
<link rel="manifest" href="mvfn-driving-manifest.json">
<link rel="apple-touch-icon" sizes="180x180" href="apple-touch-mvfn-driving.png">
<title>Business Mileage</title>
<script src="mvfn-auth.js"
        data-token-key="mvfn_device_token"
        data-validate-url="https://homelab.taile865b6.ts.net:5678/webhook/mvfn-get-driving"></script>
<style>
  :root { --ink:#2d5016; --moss:#5a7248; --paper:#eef2e9; --card:#fbfdf9;
          --red:#9b2c1f; --green:#2d6a3f; }
  * { box-sizing:border-box; }
  body { margin:0; background:#1d3110; font-family:Georgia,serif; color:#222; }
  header { background:var(--ink); color:#fff; padding:14px 16px 12px; display:flex; align-items:baseline; gap:10px; }
  header h1 { font-size:1.15rem; margin:0; flex:1; }
  header button { border:0; border-radius:6px; padding:5px 10px; font-family:inherit; font-size:.78rem;
    background:var(--paper); color:var(--ink); cursor:pointer; }
  main { max-width:560px; margin:0 auto; padding:12px 12px 60px; }
  .banner { display:none; background:var(--red); color:#fff; padding:8px 12px; border-radius:8px; margin-bottom:10px; font-size:.85rem; }
  .banner.ok { background:var(--ink); }
  .card { background:var(--card); border-radius:12px; padding:12px 14px; margin-bottom:12px; box-shadow:0 1px 4px rgba(0,0,0,.25); }
  .card h2 { font-size:.75rem; text-transform:uppercase; letter-spacing:.06em; color:var(--moss); margin:0 0 8px; }

  /* dashboard: one number that matters, a couple of KPIs. No charts. */
  .verdict { font-size:1.55rem; font-weight:700; text-align:center; padding:6px 0 2px; color:var(--green); }
  .kpis { text-align:center; font-size:.9rem; color:#333; margin-top:2px; }
  .mini { text-align:center; font-size:.78rem; color:var(--moss); margin-top:6px; }

  /* quick repeat */
  .repeats { display:flex; flex-direction:column; gap:6px; }
  .repeats button { text-align:left; padding:9px 11px; border:0; border-radius:8px; background:var(--paper);
    color:var(--ink); font-family:inherit; font-size:.88rem; cursor:pointer; }
  .repeats button .mi { float:right; font-weight:700; }

  /* form */
  details.add { background:var(--paper); border-radius:12px; padding:10px 14px; margin-bottom:14px; }
  details.add summary { font-weight:700; color:var(--ink); cursor:pointer; padding:4px 0; }
  .add label { display:block; font-size:.72rem; color:var(--moss); margin:8px 0 2px; text-transform:uppercase; letter-spacing:.04em; }
  .add input, .add select, .add textarea {
    width:100%; padding:9px 10px; border:1.5px solid var(--moss); border-radius:8px;
    font-family:inherit; font-size:.95rem; background:#fff; }
  .add textarea { min-height:48px; resize:vertical; }
  .row2 { display:grid; grid-template-columns:1fr 1fr; gap:10px; }
  .row3 { display:grid; grid-template-columns:1fr 1fr 1fr; gap:10px; }
  .preview { margin-top:8px; font-size:.82rem; color:var(--ink); background:#e2ead9; border-radius:8px; padding:7px 10px; }
  .add .btnrow { display:flex; gap:8px; }
  .add .btnrow button { margin-top:12px; flex:1; padding:12px; border:0; border-radius:8px;
    background:var(--ink); color:#fff; font-family:inherit; font-size:1rem; font-weight:700; cursor:pointer; }
  .add .btnrow button.ghost { background:#d3dbc9; color:var(--ink); }
  .add .btnrow button:disabled { opacity:.5; }

  /* trip list */
  .trip { background:var(--card); border-radius:12px; padding:10px 13px; margin-bottom:8px; box-shadow:0 1px 4px rgba(0,0,0,.25); }
  .trip .t { font-weight:700; color:var(--ink); font-size:.95rem; display:flex; justify-content:space-between; gap:8px; }
  .trip .t .mi { font-variant-numeric:tabular-nums; white-space:nowrap; }
  .trip .sub { font-size:.78rem; color:#555; margin-top:1px; }
  .chips { display:flex; flex-wrap:wrap; gap:5px; margin-top:6px; }
  .chip { font-size:.68rem; background:#dfe7d5; color:#3a4f2a; border-radius:999px; padding:2px 8px; }
  .chip.money { background:var(--ink); color:#fff; }
  .chip.imp { background:#c9cfd6; color:#555; }
  .actions { display:flex; gap:8px; margin-top:8px; }
  .actions button { flex:1; padding:7px; border:0; border-radius:8px; font-family:inherit; font-weight:700; cursor:pointer; font-size:.8rem; }
  .edit-btn { background:var(--paper); color:var(--ink); }
  .del-btn { background:#e7dcd9; color:var(--red); }
  .showall { width:100%; padding:10px; border:0; border-radius:8px; background:#3a4f2a; color:#fff;
    font-family:inherit; font-weight:700; cursor:pointer; margin-bottom:12px; }
  .empty { color:var(--paper); text-align:center; padding:30px 10px; font-size:.9rem; opacity:.85; }
  .section-h { color:var(--paper); font-size:.75rem; text-transform:uppercase; letter-spacing:.08em; margin:16px 4px 8px; opacity:.8; }

  /* print (tax log) */
  #printLog { display:none; }
  @media print {
    body > header, body > main { display:none !important; }
    body { background:#fff; }
    #printLog { display:block; font-family:Georgia,serif; color:#000; padding:0.2in; }
    #printLog h1 { font-size:16pt; margin:0 0 2pt; }
    #printLog .meta { font-size:9pt; margin:0 0 8pt; }
    #printLog h2 { font-size:13pt; margin:12pt 0 4pt; }
    #printLog table { width:100%; border-collapse:collapse; font-size:8.5pt; }
    #printLog th, #printLog td { border:1px solid #444; padding:2pt 4pt; text-align:left; }
    #printLog td.r, #printLog th.r { text-align:right; }
    #printLog .totals { margin-top:6pt; font-size:10pt; font-weight:700; }
  }
</style>
</head>
<body>
<header>
  <h1>Business Mileage</h1>
  <button id="printBtn" type="button">Tax log</button>
</header>
<main>
  <div class="banner" id="banner"></div>

  <div class="card" id="dash"><div class="kpis">Loading…</div></div>

  <div class="card" id="repeatCard" style="display:none">
    <h2>Log it again</h2>
    <div class="repeats" id="repeats"></div>
  </div>

  <details class="add" id="addBox">
    <summary id="formTitle">+ Log a trip</summary>
    <div class="row2">
      <div><label>Date</label><input type="date" id="f_date"></div>
      <div><label>Vehicle</label>
        <select id="f_vehicle">
          <option value="F-150">F-150</option>
          <option value="Kona">Kona</option>
          <option value="__other">Other…</option>
        </select></div>
    </div>
    <div id="otherRow" style="display:none">
      <label>Vehicle name</label>
      <input type="text" id="f_vehicle_other" autocomplete="off">
    </div>
    <label>Destination</label>
    <input type="text" id="f_dest" autocomplete="off">
    <label>Business purpose</label>
    <input type="text" id="f_purpose" autocomplete="off" placeholder="supply run / delivery / customer visit">
    <div class="row3">
      <div><label>Miles</label><input type="number" id="f_miles" min="0" step="0.1" inputmode="decimal"></div>
      <div><label>Odo start</label><input type="number" id="f_odos" min="0" step="0.1" inputmode="decimal"></div>
      <div><label>Odo end</label><input type="number" id="f_odoe" min="0" step="0.1" inputmode="decimal"></div>
    </div>
    <div class="preview" id="preview" style="display:none"></div>
    <label>Tolls / parking $</label>
    <input type="number" id="f_tolls" min="0" step="0.01" inputmode="decimal">
    <label>Notes</label>
    <textarea id="f_notes"></textarea>
    <div class="btnrow">
      <button class="ghost" id="f_cancel" type="button" style="display:none">Cancel</button>
      <button id="f_go" type="button">Save trip</button>
    </div>
  </details>

  <div class="section-h">Trips</div>
  <div id="list"><div class="empty">Loading…</div></div>
</main>
<div id="printLog"></div>
<script>
(function () {
  var API_GET = 'https://homelab.taile865b6.ts.net:5678/webhook/mvfn-get-driving';
  var API_POST = 'https://homelab.taile865b6.ts.net:5678/webhook/mvfn-driving';
  var VEH_KEY = 'mvfn_driving_vehicle';
  var $ = function (id) { return document.getElementById(id); };
  var state = { rates: [], totals: null, trips: [] };
  var editId = null, editSource = null, showAll = false;

  function banner(msg, kind) {
    var b = $('banner');
    b.textContent = msg || '';
    b.className = 'banner' + (kind ? ' ' + kind : '');
    b.style.display = msg ? 'block' : 'none';
  }
  function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"]/g, function (c) {
      return { '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;' }[c];
    });
  }
  function fmtMi(n) {
    n = Math.round(+n * 10) / 10;
    return (n % 1 ? n.toFixed(1) : String(n)) + ' mi';
  }
  function fmt$(n) {
    return '$' + (+n).toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
  }
  function dateLabel(iso) {  // "2026-08-24" -> "Mon 8/24"
    var p = iso.split('-');
    var d = new Date(+p[0], +p[1]-1, +p[2]);
    return ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'][d.getDay()] + ' ' + (+p[1]) + '/' + (+p[2]);
  }
  function todayIso() {
    var n = new Date();
    var pad = function (x) { return (x < 10 ? '0' : '') + x; };
    return n.getFullYear() + '-' + pad(n.getMonth()+1) + '-' + pad(n.getDate());
  }
  // ---- vehicle picker: F-150 / Kona / Other(free text) --------------------
  function setVehicle(name) {
    name = (name || '').trim();
    if (name === 'F-150' || name === 'Kona') {
      $('f_vehicle').value = name;
      $('otherRow').style.display = 'none';
      $('f_vehicle_other').value = '';
    } else if (name) {
      $('f_vehicle').value = '__other';
      $('otherRow').style.display = '';
      $('f_vehicle_other').value = name;
    } else {
      $('f_vehicle').value = 'F-150';
      $('otherRow').style.display = 'none';
      $('f_vehicle_other').value = '';
    }
  }
  function currentVehicle() {
    return $('f_vehicle').value === '__other'
      ? $('f_vehicle_other').value.trim()
      : $('f_vehicle').value;
  }

  // Display-only estimate; the server's per-trip deduction is authoritative.
  function rateFor(iso) {
    var r = null;
    (state.rates || []).forEach(function (x) {
      if (x.effective_from <= iso) r = +x.rate_per_mile;
    });
    return r;
  }

  // ---- dashboard: the YTD deduction IS the verdict ------------------------
  function renderDash() {
    var t = state.totals;
    if (!t) { $('dash').innerHTML = '<div class="kpis">Totals unavailable</div>'; return; }
    var yr = (t.today || todayIso()).slice(0, 4);
    var extras = +t.ytd_tolls > 0 ? (' + ' + fmt$(t.ytd_tolls) + ' tolls/parking') : '';
    var last = t.last_trip_date
      ? ('last trip ' + dateLabel(t.last_trip_date))
      : 'no trips logged yet';
    $('dash').innerHTML =
      '<div class="verdict">' + fmt$(t.ytd_deduction) + ' deduction</div>'
      + '<div class="kpis">' + fmtMi(t.ytd_miles) + ' · ' + t.ytd_trips + ' trips in ' + esc(yr) + extras + '</div>'
      + '<div class="mini">this month ' + fmtMi(t.month_miles) + ' · ' + esc(last) + '</div>';
  }

  // ---- quick repeat: the most-logged trips, one tap to prefill ------------
  function repeatKey(d) { return d.destination + '|' + d.purpose + '|' + d.miles + '|' + (d.vehicle || ''); }
  function renderRepeats() {
    var counts = {};
    (state.trips || []).forEach(function (d) {
      var k = repeatKey(d);
      if (!counts[k]) counts[k] = { n: 0, d: d };
      counts[k].n++;
    });
    var top = Object.keys(counts).map(function (k) { return counts[k]; })
      .filter(function (x) { return x.n >= 2; })
      .sort(function (a, b) { return b.n - a.n; })
      .slice(0, 4);
    if (!top.length) { $('repeatCard').style.display = 'none'; return; }
    $('repeatCard').style.display = '';
    $('repeats').innerHTML = top.map(function (x, i) {
      return '<button type="button" data-rep="' + i + '">' + esc(x.d.destination || x.d.purpose)
        + ' <span class="mi">' + fmtMi(x.d.miles) + '</span><br>'
        + '<small>' + (x.d.destination ? esc(x.d.purpose) + ' · ' : '') + 'logged ' + x.n + '×</small></button>';
    }).join('');
    $('repeats').querySelectorAll('button').forEach(function (btn, i) {
      btn.addEventListener('click', function () {
        var d = top[i].d;
        resetForm();
        $('f_date').value = todayIso();
        $('f_dest').value = d.destination || '';
        $('f_purpose').value = d.purpose;
        $('f_miles').value = d.miles;
        if (d.vehicle) setVehicle(d.vehicle);
        updPreview();
        if (!d.destination) $('f_dest').focus();
        $('formTitle').textContent = '+ Log a trip';
        $('addBox').open = true;
        $('addBox').scrollIntoView({ behavior: 'smooth' });
      });
    });
  }

  // ---- trip list ----------------------------------------------------------
  function renderList() {
    var ds = state.trips || [];
    if (!ds.length) {
      $('list').innerHTML = '<div class="empty">No trips yet.</div>';
      return;
    }
    var shown = showAll ? ds : ds.slice(0, 12);
    var html = '';
    shown.forEach(function (d) {
      var chips = [];
      if (d.deduction != null) chips.push('<span class="chip money">' + fmt$(d.deduction) + '</span>');
      if (d.vehicle) chips.push('<span class="chip">' + esc(d.vehicle) + '</span>');
      if (+d.tolls_parking > 0) chips.push('<span class="chip">tolls/parking ' + fmt$(d.tolls_parking) + '</span>');
      if (d.odo_start != null) chips.push('<span class="chip">odo ' + esc(d.odo_start) + ' → ' + esc(d.odo_end) + '</span>');
      if (d.source === 'import') chips.push('<span class="chip imp">import</span>');
      // import rows have no destination — their purpose text carries both
      var title = d.destination || d.purpose;
      var sub = (d.destination ? esc(d.purpose) : '') + (d.notes ? (d.destination ? ' · ' : '') + esc(d.notes) : '');
      html += '<div class="trip">'
        + '<div class="t"><span>' + dateLabel(d.trip_date) + ' · ' + esc(title) + '</span>'
        + '<span class="mi">' + fmtMi(d.miles) + '</span></div>'
        + (sub ? '<div class="sub">' + sub + '</div>' : '')
        + '<div class="chips">' + chips.join('') + '</div>'
        + '<div class="actions">'
        + '<button class="edit-btn" data-edit="' + d.trip_id + '">Edit</button>'
        + '<button class="del-btn" data-del="' + d.trip_id + '">Delete</button>'
        + '</div></div>';
    });
    if (!showAll && ds.length > shown.length) {
      html += '<button class="showall" id="showAllBtn">Show all ' + ds.length + ' trips</button>';
    }
    $('list').innerHTML = html;
    var sa = $('showAllBtn');
    if (sa) sa.addEventListener('click', function () { showAll = true; renderList(); });
  }

  // ---- form ---------------------------------------------------------------
  var derived = {}; // field id -> true while its value is our math, not Ian's
  function autoOdoMath(src) {
    // Any two of miles / odo start / odo end determine the third — fill it in.
    // Never write into the field being typed, never overwrite a hand-entered
    // value; clearing a source field clears what was derived from it.
    derived[src] = false;
    var ids = ['f_miles', 'f_odos', 'f_odoe'];
    var v = {};
    ids.forEach(function (id) { v[id] = parseFloat($(id).value); });
    if (!Number.isFinite(v[src])) {
      ids.forEach(function (id) { if (derived[id]) { $(id).value = ''; derived[id] = false; } });
      return;
    }
    var others = ids.filter(function (id) { return id !== src; });
    var target;
    if (Number.isFinite(v[others[0]]) !== Number.isFinite(v[others[1]])) {
      target = Number.isFinite(v[others[0]]) ? others[1] : others[0];
    } else {
      // both known (or neither): only a value we filled ourselves may be redone
      target = derived[others[0]] ? others[0] : derived[others[1]] ? others[1] : null;
    }
    if (!target || (!derived[target] && $(target).value !== '')) return;
    var out = target === 'f_miles' ? v.f_odoe - v.f_odos
            : target === 'f_odoe'  ? v.f_odos + v.f_miles
            :                        v.f_odoe - v.f_miles;
    if (!Number.isFinite(out) || out < 0 || (target === 'f_miles' && out <= 0)) return;
    $(target).value = Math.round(out * 10) / 10;
    derived[target] = true;
  }

  function formMiles() {
    // Odometer pair wins when complete (the server recomputes the same way);
    // otherwise the miles field. null when neither is usable.
    var os = parseFloat($('f_odos').value), oe = parseFloat($('f_odoe').value);
    if (Number.isFinite(os) && Number.isFinite(oe) && oe > os) {
      return { miles: Math.round((oe - os) * 10) / 10, fromOdo: true };
    }
    var m = parseFloat($('f_miles').value);
    if (Number.isFinite(m) && m > 0) return { miles: Math.round(m * 10) / 10, fromOdo: false };
    return null;
  }
  function updPreview() {
    var pv = $('preview');
    var m = formMiles();
    if (!m) { pv.style.display = 'none'; return; }
    var iso = $('f_date').value || todayIso();
    var r = rateFor(iso);
    var txt = fmtMi(m.miles) + (m.fromOdo ? ' from the odometer' : '');
    if (r) txt += ' — about ' + fmt$(m.miles * r) + ' at $' + r + '/mi';
    pv.textContent = txt;
    pv.style.display = 'block';
  }

  function resetForm() {
    editId = null; editSource = null; derived = {};
    $('formTitle').textContent = '+ Log a trip';
    ['f_dest','f_purpose','f_miles','f_odos','f_odoe','f_tolls','f_notes'].forEach(function (id) { $(id).value = ''; });
    $('f_date').value = todayIso();
    setVehicle(localStorage.getItem(VEH_KEY) || '');
    $('f_cancel').style.display = 'none';
    $('f_go').textContent = 'Save trip';
    $('preview').style.display = 'none';
    $('addBox').open = false;
  }

  function openEdit(d) {
    resetForm();
    editId = d.trip_id; editSource = d.source;
    $('formTitle').textContent = 'Edit trip · ' + dateLabel(d.trip_date);
    $('f_date').value = d.trip_date;
    $('f_dest').value = d.destination || '';
    $('f_purpose').value = d.purpose;
    if (d.odo_start != null) { $('f_odos').value = d.odo_start; $('f_odoe').value = d.odo_end; }
    else $('f_miles').value = d.miles;
    setVehicle(d.vehicle || '');
    if (+d.tolls_parking > 0) $('f_tolls').value = d.tolls_parking;
    $('f_notes').value = d.notes || '';
    updPreview();
    $('f_cancel').style.display = '';
    $('f_go').textContent = 'Save changes';
    $('addBox').open = true;
    $('addBox').scrollIntoView({ behavior: 'smooth' });
  }

  function post(payload, btn) {
    if (btn) btn.disabled = true;
    banner('');
    return fetch(API_POST, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(payload),
    }).then(function (r) {
      return r.json().catch(function () { return null; }).then(function (j) {
        if (!r.ok || (j && j.status === 'error')) {
          throw new Error((j && j.message) || ('HTTP ' + r.status));
        }
        return j || {};
      });
    }).then(function (j) { load(); return j; })
      .catch(function (e) { banner(String(e.message || e)); return null; })
      .finally(function () { if (btn) btn.disabled = false; });
  }

  ['f_miles','f_odos','f_odoe'].forEach(function (id) {
    $(id).addEventListener('input', function () { autoOdoMath(id); updPreview(); });
  });
  $('f_date').addEventListener('input', updPreview);
  $('f_vehicle').addEventListener('change', function () {
    $('otherRow').style.display = this.value === '__other' ? '' : 'none';
    if (this.value === '__other') $('f_vehicle_other').focus();
  });

  $('f_go').addEventListener('click', function () {
    var dest = $('f_dest').value.trim(), purpose = $('f_purpose').value.trim();
    var importEdit = editId !== null && editSource === 'import';
    if (!$('f_date').value) { banner('Date is required'); return; }
    // imported spreadsheet rows have no destination column — purpose carries it
    if (!dest && !importEdit) { banner('Destination is required'); return; }
    if (!purpose) { banner('Business purpose is required'); return; }
    if (!formMiles()) { banner('Miles (or a full odometer pair) is required'); return; }
    var vehicle = currentVehicle();
    if ($('f_vehicle').value === '__other' && !vehicle) { banner('Enter the vehicle name'); return; }
    if (vehicle) localStorage.setItem(VEH_KEY, vehicle);
    var payload = {
      action: editId !== null ? 'update' : 'log',
      trip_date: $('f_date').value,
      destination: dest,
      purpose: purpose,
      miles: $('f_miles').value.trim(),
      odo_start: $('f_odos').value.trim(),
      odo_end: $('f_odoe').value.trim(),
      vehicle: vehicle,
      tolls_parking: $('f_tolls').value.trim(),
      notes: $('f_notes').value.trim(),
    };
    if (editId !== null) payload.trip_id = editId;
    // an import row keeps its NULL destination unless one is typed in
    if (importEdit && !dest) delete payload.destination;
    post(payload, $('f_go')).then(function (j) {
      if (!j || !j.result) return;
      var r = j.result;
      banner((payload.action === 'log' ? 'Logged ' : 'Saved ')
        + fmtMi(r.miles) + (r.destination ? ' to ' + r.destination : ''), 'ok');
      resetForm();
    });
  });
  $('f_cancel').addEventListener('click', resetForm);

  // ---- list actions -------------------------------------------------------
  $('list').addEventListener('click', function (e) {
    var btn = e.target.closest('button');
    if (!btn) return;
    if (btn.dataset.edit) {
      var d = state.trips.filter(function (x) { return String(x.trip_id) === btn.dataset.edit; })[0];
      if (d) openEdit(d);
    } else if (btn.dataset.del) {
      var dd = state.trips.filter(function (x) { return String(x.trip_id) === btn.dataset.del; })[0];
      var name = dd ? (dateLabel(dd.trip_date) + ' — ' + (dd.destination || dd.purpose)) : ('#' + btn.dataset.del);
      if (!confirm('Delete the trip on ' + name + '?')) return;
      post({ action: 'delete', trip_id: parseInt(btn.dataset.del, 10) }, btn).then(function (j) {
        if (j && j.result) banner('Deleted trip on ' + name, 'ok');
      });
    }
  });

  // ---- printable tax log --------------------------------------------------
  $('printBtn').addEventListener('click', function () {
    var byYear = {};
    state.trips.forEach(function (d) {
      var y = d.trip_date.slice(0, 4);
      (byYear[y] = byYear[y] || []).push(d);
    });
    var years = Object.keys(byYear).sort();
    var html = '<h1>MVFN Business Mileage Log</h1>'
      + '<div class="meta">Generated ' + todayIso()
      + ' · IRS standard mileage rate(s): '
      + (state.rates || []).map(function (r) {
          return '$' + r.rate_per_mile + '/mi from ' + r.effective_from;
        }).join('; ')
      + '</div>';
    years.forEach(function (y) {
      var rows = byYear[y].slice().reverse();  // oldest first on paper
      var tMi = 0, tDed = 0, tTolls = 0;
      html += '<h2>' + y + '</h2>'
        + '<table><tr><th>Date</th><th>Destination</th><th>Business purpose</th>'
        + '<th>Vehicle</th><th class="r">Miles</th><th class="r">Tolls/parking</th></tr>';
      rows.forEach(function (d) {
        var p = d.trip_date.split('-');
        tMi += +d.miles; tDed += +(d.deduction || 0); tTolls += +d.tolls_parking;
        html += '<tr><td>' + p[1] + '/' + p[2] + '/' + p[0] + '</td>'
          + '<td>' + esc(d.destination) + '</td><td>' + esc(d.purpose) + '</td>'
          + '<td>' + esc(d.vehicle || '') + '</td>'
          + '<td class="r">' + (+d.miles).toFixed(1) + '</td>'
          + '<td class="r">' + (+d.tolls_parking > 0 ? fmt$(d.tolls_parking) : '') + '</td></tr>';
      });
      html += '</table>'
        + '<div class="totals">' + y + ' totals: ' + tMi.toFixed(1) + ' miles · '
        + 'mileage deduction ' + fmt$(tDed)
        + (tTolls > 0 ? ' · tolls/parking ' + fmt$(tTolls) : '') + '</div>';
    });
    if (!years.length) html += '<div class="totals">No trips logged.</div>';
    $('printLog').innerHTML = html;
    window.print();
  });

  // ---- load ---------------------------------------------------------------
  function load() {
    fetch(API_GET).then(function (r) {
      if (!r.ok) throw new Error('load failed: HTTP ' + r.status);
      return r.json();
    }).then(function (j) {
      state = j;
      renderDash();
      renderRepeats();
      renderList();
    }).catch(function (e) { banner(String(e.message || e)); });
  }

  $('f_date').value = todayIso();
  setVehicle(localStorage.getItem(VEH_KEY) || '');
  load();
})();
</script>
</body>
</html>
