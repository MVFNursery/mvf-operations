<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1f3a5f">
<link rel="manifest" href="hh-triage-manifest.json">
<title>Identity Triage</title>
<script src="mvfn-auth.js"
        data-token-key="mvfn_household_token"
        data-validate-url="https://homelab.taile865b6.ts.net:5680/webhook/hh-triage"></script>
<style>
  :root { --ink:#1f3a5f; --slate:#4a6584; --paper:#eef1f5; --card:#fbfcfe;
          --red:#9b2c1f; --green:#2d6a3f; --amber:#9a6b1f; }
  * { box-sizing:border-box; }
  body { margin:0; background:#14263d; font-family:Georgia,serif; color:#222; }
  header { background:var(--ink); color:#fff; padding:14px 16px 12px; display:flex; align-items:baseline; gap:10px; }
  header h1 { font-size:1.15rem; margin:0; flex:1; }
  header button { border:0; border-radius:6px; padding:5px 10px; font-family:inherit; font-size:.78rem;
    background:var(--paper); color:var(--ink); cursor:pointer; }
  main { max-width:560px; margin:0 auto; padding:12px 12px 40px; }
  .banner { display:none; background:var(--red); color:#fff; padding:8px 12px; border-radius:8px; margin-bottom:10px; font-size:.85rem; }
  .banner.ok { background:var(--green); }
  .card { background:var(--card); border-radius:12px; padding:12px 14px; margin-bottom:12px; box-shadow:0 1px 4px rgba(0,0,0,.25); }
  .card h2 { font-size:.75rem; text-transform:uppercase; letter-spacing:.06em; color:var(--slate); margin:0 0 8px; }
  .muted { color:var(--slate); font-size:.8rem; }
  .tabs { display:flex; gap:8px; flex-wrap:wrap; margin-bottom:12px; }
  .tab { border:0; border-radius:99px; padding:9px 16px; font-family:inherit; font-size:.9rem; font-weight:700;
    background:var(--card); color:var(--ink); cursor:pointer; }
  .tab.on { background:var(--amber); color:#fff; }
  .tab .n { font-weight:400; opacity:.8; font-size:.78rem; }
  .stage { position:relative; background:#0a1420; border-radius:12px; overflow:hidden; min-height:220px;
    display:flex; align-items:center; justify-content:center; }
  .stage img { width:100%; max-height:60vh; object-fit:contain; display:block; }
  .stage .wait { color:#7d92ad; font-size:.85rem; }
  .prog { position:absolute; top:8px; right:10px; background:rgba(10,20,32,.75); color:#fff;
    font-size:.75rem; padding:3px 9px; border-radius:99px; }
  .btnrow { display:flex; flex-wrap:wrap; gap:8px; margin-top:10px; }
  .btn { border:0; border-radius:10px; padding:14px 16px; font-family:inherit; font-size:1rem; font-weight:700;
    cursor:pointer; flex:1 1 40%; }
  .btn.cls { background:var(--ink); color:#fff; }
  .btn.none { background:var(--slate); color:#fff; }
  .btn.minor { background:var(--paper); color:var(--ink); flex:1 1 28%; font-size:.85rem; padding:10px 12px; }
  .btn.danger { background:var(--red); color:#fff; flex:1 1 28%; font-size:.85rem; padding:10px 12px; }
  .btn.big { background:var(--green); color:#fff; flex:1 1 100%; }
  .btn.amber { background:var(--amber); color:#fff; flex:1 1 100%; }
  .btn[disabled] { opacity:.55; cursor:wait; }
  .counts { font-size:.78rem; color:var(--slate); margin-top:8px; line-height:1.5; }
</style>
</head>
<body>
<header>
  <h1>Identity Triage</h1>
  <button onclick="boot()">Refresh</button>
  <button onclick="mvfnLock()">Lock</button>
</header>
<main>
  <div id="banner" class="banner"></div>
  <div id="tabs" class="tabs"></div>
  <div id="body" class="muted">Loading…</div>
</main>

<script>
var API = 'https://homelab.taile865b6.ts.net:5680/webhook/hh-triage';
var summary = null, cur = null;   // cur = { queue, kind, classes, items, idx, labeled, counts }
var imgCache = {};                 // file -> objectURL

function $(id){ return document.getElementById(id); }
function banner(msg, ok){ var b=$('banner'); b.textContent=msg; b.className='banner'+(ok?' ok':''); b.style.display='block';
  clearTimeout(banner._t); banner._t=setTimeout(function(){ b.style.display='none'; }, 5000); }
function esc(s){ var d=document.createElement('div'); d.textContent=s==null?'':String(s); return d.innerHTML; }
function pretty(name){ return String(name).replace(/_/g,' ').replace(/\b[a-z]/g, function(c){ return c.toUpperCase(); }); }

function api(params){ // GET returning envelope json
  var qs = Object.keys(params).map(function(k){ return k+'='+encodeURIComponent(params[k]); }).join('&');
  return fetch(API+(qs?'?'+qs:'')).then(function(r){ return r.json(); });
}
function post(body){
  return fetch(API, { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify(body) })
    .then(function(r){ return r.json(); });
}

function boot(){
  $('body').innerHTML = '<span class="muted">Loading…</span>';
  api({}).then(function(j){
    if (j.status!=='ok'){ banner('Failed: '+(j.message||'unknown')); return; }
    summary = j;
    renderTabs();
    // auto-open: first tab with pending work, else first tab
    var tabs = tabList();
    var target = tabs.find(function(t){ return t.pending>0; }) || tabs[0];
    if (target) openQueue(target.queue); else $('body').innerHTML='<span class="muted">No models configured in Frigate yet.</span>';
  }).catch(function(){ $('body').innerHTML='<span class="muted">Could not load — check Tailscale.</span>'; });
}

function tabList(){
  var tabs = (summary.models||[]).filter(function(m){ return m.enabled; })
    .map(function(m){ return { queue:m.name, label:pretty(m.name), pending:m.pending }; });
  if (summary.faces && summary.faces.enabled)
    tabs.push({ queue:'faces', label:'People', pending:summary.faces.pending });
  return tabs;
}

function renderTabs(){
  $('tabs').innerHTML = tabList().map(function(t){
    return '<button class="tab'+(cur&&cur.queue===t.queue?' on':'')+'" onclick="openQueue(\''+t.queue+'\')">'+
      esc(t.label)+' <span class="n">'+t.pending+'</span></button>';
  }).join('');
}

function openQueue(queue){
  $('body').innerHTML = '<span class="muted">Loading queue…</span>';
  api({ q: queue }).then(function(j){
    if (j.status!=='ok'){ banner('Failed: '+(j.message||'unknown')); return; }
    cur = { queue:queue, kind:j.kind, classes:j.classes||[], items:j.items||[], idx:0,
            labeled:0, counts:j.dataset_counts||null };
    renderTabs();
    renderCard();
  }).catch(function(){ banner('Failed — network'); });
}

function imgUrl(file, cb){
  if (imgCache[file]) return cb(imgCache[file]);
  fetch(API+'?q='+encodeURIComponent(cur.queue)+'&img='+encodeURIComponent(file))
    .then(function(r){ if(!r.ok) throw 0; return r.blob(); })
    .then(function(b){ imgCache[file]=URL.createObjectURL(b); cb(imgCache[file]); })
    .catch(function(){ cb(null); });
}

function renderCard(){
  var c = cur;
  if (!c) return;
  if (c.idx >= c.items.length){ return renderDone(); }
  var file = c.items[c.idx];
  var isFaces = c.kind==='faces';
  var clsBtns = c.classes.map(function(cl){
    return '<button class="btn cls" onclick="assign(\''+esc(cl).replace(/'/g,"\\'")+'\')">'+esc(pretty(cl))+'</button>';
  }).join('');
  $('body').innerHTML =
    '<div class="card">'+
      '<div class="stage"><span class="prog">'+(c.idx+1)+' / '+c.items.length+'</span>'+
        '<span class="wait" id="imgwait">loading image…</span><img id="curimg" alt="" style="display:none"></div>'+
      '<div class="btnrow">'+ clsBtns +
        (isFaces ? '' : '<button class="btn none" onclick="assign(\'none\')">Not ours</button>') +
      '</div>'+
      '<div class="btnrow">'+
        '<button class="btn minor" onclick="newClass()">+ New '+(isFaces?'person':'class')+'</button>'+
        '<button class="btn minor" onclick="skip()">Skip</button>'+
        '<button class="btn danger" onclick="removeItem()">Delete image</button>'+
      '</div>'+
      (c.labeled ? '<div class="counts">'+c.labeled+' labeled this session — retrain when you\'re done.</div>' : '')+
    '</div>'+
    (c.labeled && !isFaces ? '<button class="btn big" onclick="retrain()">Retrain model now ('+c.labeled+' new)</button>' : '');
  imgUrl(file, function(u){
    if (u){ var im=$('curimg'); im.src=u; im.style.display='block'; var w=$('imgwait'); if(w) w.remove(); }
    else { var w2=$('imgwait'); if(w2) w2.textContent='image failed to load — Skip or Delete'; }
  });
  // preload the next crop so advancing feels instant
  if (c.items[c.idx+1]) imgUrl(c.items[c.idx+1], function(){});
}

function renderDone(){
  var c = cur, isFaces = c.kind==='faces';
  var countsHtml = '';
  if (c.counts){
    countsHtml = '<div class="counts">Dataset: '+Object.keys(c.counts).map(function(k){
      return esc(pretty(k))+' '+c.counts[k]; }).join(' · ')+'</div>';
  }
  $('body').innerHTML =
    '<div class="card"><h2>'+esc(isFaces?'People':pretty(c.queue))+'</h2>'+
    '<div class="muted">Queue empty — nothing waiting to be labeled.</div>'+countsHtml+'</div>'+
    (c.labeled && !isFaces ? '<button class="btn big" onclick="retrain()">Retrain model now ('+c.labeled+' new)</button>' : '')+
    (isFaces
      ? '<div class="card"><div class="muted">Face attempts appear here automatically as the camera sees people. Faces retrain on assignment — no retrain button needed.</div></div>'
      : '<button class="btn amber" onclick="harvest()">Harvest from history — pull a balanced sample of past events</button>');
}

function advance(){
  cur.idx++;
  renderCard();
}

function assign(category){
  var c = cur, file = c.items[c.idx];
  var p = (c.kind==='faces')
    ? post({ action:'face_assign', name:category, training_file:file })
    : post({ action:'categorize', queue:c.queue, training_file:file, category:category });
  p.then(function(j){
    if (j.status==='ok'){ c.labeled++; advance(); }
    else banner('Failed: '+(j.message||'unknown'));
  }).catch(function(){ banner('Failed — network'); });
}

function skip(){ advance(); }

function removeItem(){
  var c = cur, file = c.items[c.idx];
  post({ action:'remove', queue:c.queue, training_file:file }).then(function(j){
    if (j.status==='ok'){ delete imgCache[file]; advance(); }
    else banner('Failed: '+(j.message||'unknown'));
  }).catch(function(){ banner('Failed — network'); });
}

function newClass(){
  var isFaces = cur.kind==='faces';
  var name = prompt(isFaces ? 'New person name (letters/numbers/dashes):'
                            : 'New class name (e.g. UPS Truck):');
  if (!name) return;
  name = name.trim();
  if (!name) return;
  post({ action:'create_class', queue:cur.queue, category:name }).then(function(j){
    if (j.status==='ok'){ banner('Created "'+name+'"', true); cur.classes.push(name); renderCard(); }
    else banner('Failed: '+(j.message||'unknown'));
  }).catch(function(){ banner('Failed — network'); });
}

function retrain(){
  var c = cur;
  var btns = document.querySelectorAll('.btn'); btns.forEach(function(b){ b.disabled=true; });
  banner('Training… (~15s)', true);
  post({ action:'retrain', queue:c.queue }).then(function(j){
    if (j.status==='ok'){ banner('Model retrained and live', true); c.labeled=0; openQueue(c.queue); }
    else { banner('Failed: '+(j.message||'unknown')); btns.forEach(function(b){ b.disabled=false; }); }
  }).catch(function(){ banner('Failed — network'); btns.forEach(function(b){ b.disabled=false; }); });
}

function harvest(){
  var c = cur;
  var btns = document.querySelectorAll('.btn'); btns.forEach(function(b){ b.disabled=true; });
  banner('Harvesting from event history… (runs in the background, ~30s)', true);
  post({ action:'harvest', queue:c.queue }).then(function(j){
    if (j.status!=='ok'){ banner('Failed: '+(j.message||'unknown')); btns.forEach(function(b){ b.disabled=false; }); return; }
    // generation is async server-side — poll until crops appear (or give up)
    var tries = 0;
    (function poll(){
      tries++;
      api({ q: c.queue }).then(function(qj){
        if (qj.status==='ok' && (qj.items||[]).length){ banner('Harvest done — queue refilled', true); openQueue(c.queue); }
        else if (tries < 20) setTimeout(poll, 4000);
        else { banner('Harvest finished with nothing new — no un-labeled history?'); openQueue(c.queue); }
      }).catch(function(){ if (tries < 20) setTimeout(poll, 4000); });
    })();
  }).catch(function(){ banner('Failed — network/timeout'); btns.forEach(function(b){ b.disabled=false; }); });
}

boot();
</script>
</body>
</html>
