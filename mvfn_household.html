<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2d5016">
<link rel="manifest" href="household-manifest.json">
<title>MVFN Household Tasks</title>
<script src="mvfn-auth.js"
        data-token-key="mvfn_household_token"
        data-validate-url="https://homelab.taile865b6.ts.net:5680/webhook/mvfn-household-tasks"></script>
<style>
  :root { --ink:#2d5016; --moss:#5a6b2d; --paper:#f5f0e8; --card:#fffdf8; --red:#9b2c1f; }
  * { box-sizing:border-box; }
  body { margin:0; background:#1a2e0f; font-family:Georgia,serif; color:#222; }
  header { background:var(--ink); color:#fff; padding:14px 16px 12px; display:flex; align-items:baseline; gap:10px; }
  header h1 { font-size:1.15rem; margin:0; flex:1; }
  header select { border:0; border-radius:6px; padding:4px 6px; font-family:inherit; background:var(--paper); color:var(--ink); }
  main { max-width:560px; margin:0 auto; padding:12px 12px 60px; }
  .banner { display:none; background:var(--red); color:#fff; padding:8px 12px; border-radius:8px; margin-bottom:10px; font-size:.85rem; }
  /* Receipts share the banner slot — a completion says WHICH task it closed. */
  .banner.ok { background:var(--ink); }
  details.add { background:var(--paper); border-radius:12px; padding:10px 14px; margin-bottom:14px; }
  details.add summary { font-weight:700; color:var(--ink); cursor:pointer; padding:4px 0; }
  .add label { display:block; font-size:.72rem; color:var(--moss); margin:8px 0 2px; text-transform:uppercase; letter-spacing:.04em; }
  .add input[type=text], .add input[type=date], .add input[type=number],
  .add select, .add textarea {
    width:100%; padding:9px 10px; border:1.5px solid var(--moss); border-radius:8px;
    font-family:inherit; font-size:.95rem; background:#fff;
  }
  .add textarea { min-height:56px; resize:vertical; }
  .row2 { display:grid; grid-template-columns:1fr 1fr; gap:10px; }
  .checks { display:flex; gap:16px; margin-top:10px; font-size:.85rem; color:var(--ink); flex-wrap:wrap; }
  .checks label { display:flex; align-items:center; gap:5px; margin:0; text-transform:none; font-size:.85rem; color:var(--ink); }
  .add button { margin-top:12px; width:100%; padding:12px; border:0; border-radius:8px;
    background:var(--ink); color:#fff; font-family:inherit; font-size:1rem; font-weight:700; cursor:pointer; }
  .add button:disabled { opacity:.5; }
  .card { background:var(--card); border-radius:12px; padding:11px 13px; margin-bottom:10px; box-shadow:0 1px 4px rgba(0,0,0,.25); }
  .card .t { font-weight:700; color:#1e3a0d; font-size:1rem; }
  .card .t .tid { font-size:.72rem; font-weight:400; color:var(--moss); margin-left:6px; white-space:nowrap; }
  .card .d { font-size:.82rem; color:#555; margin-top:2px; white-space:pre-wrap; }
  .chips { display:flex; flex-wrap:wrap; gap:5px; margin-top:7px; }
  .chip { font-size:.68rem; background:#e7e2d2; color:#3d4a1e; border-radius:999px; padding:2px 8px; }
  .chip.due { background:#dbe7c9; }
  .chip.over { background:var(--red); color:#fff; }
  .chip.hard { background:#3d1f1a; color:#fff; }
  .chip.priv { background:#4a3d6b; color:#fff; }
  .actions { display:flex; gap:8px; margin-top:9px; }
  .actions button { flex:1; padding:8px; border:0; border-radius:8px; font-family:inherit; font-weight:700; cursor:pointer; font-size:.85rem; }
  .done-btn { background:var(--ink); color:#fff; }
  .cancel-btn { background:#e7e2d2; color:var(--red); }
  .empty { color:var(--paper); text-align:center; padding:30px 10px; font-size:.9rem; opacity:.85; }
  .chip.proj { background:#cfe3dd; color:#1f4a3d; }
  .projbar { margin-bottom:10px; }
  .projbar select { width:100%; padding:8px 10px; border:0; border-radius:8px;
    font-family:inherit; font-size:.9rem; background:var(--paper); color:var(--ink); }
  .actions select.proj-sel { flex:1; padding:8px; border:0; border-radius:8px;
    font-family:inherit; font-size:.8rem; background:#e7e2d2; color:#3d4a1e; min-width:0; }
  .section-h { color:var(--paper); font-size:.75rem; text-transform:uppercase; letter-spacing:.08em; margin:16px 4px 8px; opacity:.8; }
  .refresh-btn { width:30px; height:30px; border:0; border-radius:8px; background:var(--paper);
    color:var(--ink); font-size:1rem; line-height:1; cursor:pointer; }
  .refresh-btn:active { opacity:.6; }
  .refresh-btn[disabled] { opacity:.5; }
</style>
</head>
<body>
<header>
  <h1>MVFN Household</h1>
  <label style="font-size:.7rem;opacity:.85">Me:</label>
  <select id="me"></select>
  <button class="refresh-btn" id="refreshBtn" title="Refresh">↻</button>
</header>
<main>
  <div class="banner" id="banner"></div>

  <div class="projbar"><select id="projFilter"></select></div>

  <details class="add" id="addBox">
    <summary>+ Add task</summary>
    <label>Title *</label>
    <input type="text" id="f_title" autocomplete="off">
    <div class="row2">
      <div><label>Category *</label><select id="f_cat"></select></div>
      <div><label>Assign to</label><select id="f_assign"><option value="">Unassigned</option></select></div>
    </div>
    <div class="row2">
      <div><label>Due</label><input type="date" id="f_due"></div>
      <div><label>Effort (min)</label><input type="number" id="f_effort" min="1" inputmode="numeric"></div>
    </div>
    <div class="row2">
      <div><label>Not before (window opens)</label><input type="date" id="f_nb"></div>
      <div></div>
    </div>
    <div class="row2">
      <div><label>Weather needs</label>
        <select id="f_wx">
          <option value="none">None</option>
          <option value="dry_window">Dry window</option>
          <option value="no_frost">No frost</option>
          <option value="calm_wind">Calm wind</option>
        </select></div>
      <div><label>Repeat</label>
        <select id="f_recur">
          <option value="">Never</option>
          <option value="1 week">Weekly</option>
          <option value="2 weeks">Every 2 weeks</option>
          <option value="1 month">Monthly</option>
          <option value="2 months">Every 2 months</option>
          <option value="3 months">Every 3 months</option>
          <option value="6 months">Every 6 months</option>
          <option value="1 year">Yearly</option>
        </select></div>
    </div>
    <div class="checks">
      <label><input type="checkbox" id="f_hard"> Hard deadline</label>
      <label><input type="checkbox" id="f_priv"> Private (only me)</label>
    </div>
    <label>Detail</label>
    <textarea id="f_detail"></textarea>
    <button id="f_go">Add task</button>
  </details>

  <div id="list"><div class="empty">Loading…</div></div>
</main>
<script>
(function () {
  var API = 'https://homelab.taile865b6.ts.net:5680/webhook/mvfn-household-tasks';
  var ME_KEY = 'mvfn_household_user';
  var $ = function (id) { return document.getElementById(id); };
  var state = { users: [], categories: [], tasks: [], projects: [] };
  var lastLoad = 0;
  var STALE_MS = 60000;

  function banner(msg, kind) {
    var b = $('banner');
    b.textContent = msg || '';
    b.className = 'banner' + (kind ? ' ' + kind : '');
    b.style.display = msg ? 'block' : 'none';
  }
  function me() { return localStorage.getItem(ME_KEY) || 'ian'; }
  function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"]/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c];
    });
  }

  function load() {
    banner('');
    var btn = $('refreshBtn');
    if (btn) btn.disabled = true;
    // no-store: the response carries an ETag and no Cache-Control, so iOS is
    // free to answer this GET from cache. A task written anywhere else (another
    // phone, the MCP connector, psql) would then stay invisible here.
    return fetch(API, { cache: 'no-store' }).then(function (r) {
      if (!r.ok) throw new Error('list failed: HTTP ' + r.status);
      return r.json();
    }).then(function (j) {
      state = j;
      lastLoad = Date.now();
      renderMeta();
      renderList();
    }).catch(function (e) { banner(String(e.message || e)); })
      .finally(function () { if (btn) btn.disabled = false; });
  }

  function renderMeta() {
    var meSel = $('me'), aSel = $('f_assign'), cSel = $('f_cat');
    meSel.innerHTML = ''; cSel.innerHTML = '';
    aSel.innerHTML = '<option value="">Unassigned</option>';
    state.users.forEach(function (u) {
      meSel.insertAdjacentHTML('beforeend',
        '<option value="' + esc(u.user_id) + '">' + esc(u.display_name) + '</option>');
      aSel.insertAdjacentHTML('beforeend',
        '<option value="' + esc(u.user_id) + '">' + esc(u.display_name) + '</option>');
    });
    meSel.value = me();
    state.categories.forEach(function (c) {
      cSel.insertAdjacentHTML('beforeend',
        '<option value="' + esc(c.category_id) + '">' + esc(c.label) + '</option>');
    });
    // Project filter (top of list). Selection survives a reload of the payload.
    var pf = $('projFilter'), was = pf.value;
    var opts = '<option value="">All projects</option><option value="none">No project</option>';
    (state.projects || []).forEach(function (p) {
      opts += '<option value="' + esc(p.id) + '">' + esc(p.name)
            + (p.status === 'complete' ? ' (complete)' : '')
            + ' · ' + esc(p.open_tasks) + ' open</option>';
    });
    pf.innerHTML = opts;
    if (was && pf.querySelector('option[value="' + was + '"]')) pf.value = was;
  }

  function chip(text, cls) { return '<span class="chip ' + (cls || '') + '">' + esc(text) + '</span>'; }

  function renderList() {
    // Local calendar date, not toISOString() (UTC): from ~8pm ET the UTC date
    // is already tomorrow, which would open windows and flag overdue a day early.
    var today = new Date().toLocaleDateString('sv-SE');
    // Private rows: server returns all; render only what this device's user may see.
    var visible = state.tasks.filter(function (t) {
      return t.visibility !== 'private' || t.assigned_to === me()
        || (!t.assigned_to && t.created_by === me());
    });
    // Closed-window rows (V013: not_before in the future) are hidden outright;
    // the daily email's Upcoming section is the surface for future-windowed work.
    visible = visible.filter(function (t) {
      return !(t.not_before && t.not_before > today);
    });
    var pf = $('projFilter').value;
    if (pf === 'none') visible = visible.filter(function (t) { return !t.project_ref; });
    else if (pf) visible = visible.filter(function (t) { return t.project_ref === pf; });
    if (!visible.length) {
      $('list').innerHTML = '<div class="empty">No open tasks. Add one above.</div>';
      return;
    }
    var html = '';
    visible.forEach(function (t) {
      var chips = [chip(t.category_label)];
      if (t.project) chips.push(chip('🗂 ' + t.project, 'proj'));
      chips.push(chip(t.assigned_to
        ? '@' + (state.users.find(function (u) { return u.user_id === t.assigned_to; }) || { display_name: t.assigned_to }).display_name
        : 'unassigned'));
      if (t.not_before && t.not_before > today) chips.push(chip('opens ' + t.not_before));
      if (t.due_date) chips.push(chip('due ' + t.due_date, t.due_date < today ? 'over' : 'due'));
      if (t.hard_deadline) chips.push(chip('HARD', 'hard'));
      if (t.effort_minutes) chips.push(chip(t.effort_minutes + 'm'));
      if (t.weather_rule && t.weather_rule !== 'none') chips.push(chip(t.weather_rule.replace('_', ' ')));
      if (t.recur_interval) chips.push(chip('↻ ' + t.recur_interval.replace('mons', 'months')));
      if (t.visibility === 'private') chips.push(chip('private', 'priv'));
      if (t.status === 'blocked') chips.push(chip('BLOCKED', 'over'));
      html += '<div class="card">'
        + '<div class="t">' + esc(t.title)
        + (t.task_id != null ? ' <span class="tid">#' + esc(t.task_id) + '</span>' : '') + '</div>'
        + (t.detail ? '<div class="d">' + esc(t.detail) + '</div>' : '')
        + '<div class="chips">' + chips.join('') + '</div>'
        + '<div class="actions">'
        + '<button class="done-btn" data-done="' + t.task_id + '">Done</button>'
        + '<button class="cancel-btn" data-cancel="' + t.task_id + '">Cancel</button>'
        + projSelect(t)
        + '</div></div>';
    });
    $('list').innerHTML = html;
  }

  // Per-card project picker: active projects (+ the task's own even if
  // complete, so it can be un-set), No project, and New project… which
  // prompts for a name, creates it, then files the task into it.
  function projSelect(t) {
    var h = '<select class="proj-sel" data-task="' + t.task_id + '">'
          + '<option value=""' + (!t.project_ref ? ' selected' : '') + '>No project</option>';
    (state.projects || []).forEach(function (p) {
      if (p.status !== 'active' && p.id !== t.project_ref) return;
      h += '<option value="' + esc(p.id) + '"' + (t.project_ref === p.id ? ' selected' : '')
         + '>🗂 ' + esc(p.name) + '</option>';
    });
    return h + '<option value="__new">➕ New project…</option></select>';
  }

  function setProject(taskId, projId, sel) {
    post({ action: 'set_project', task_id: taskId, project_id: projId, user_id: me() }, sel)
      .then(function (j) {
        if (!j || !j.result) return;
        banner(projId ? ('Filed “' + j.result.title + '” under ' + j.result.project)
                      : ('Removed “' + j.result.title + '” from its project'), 'ok');
      });
  }

  function post(payload, btn) {
    if (btn) btn.disabled = true;
    banner('');
    return fetch(API, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(payload),
    }).then(function (r) {
      return r.json().catch(function () { return null; }).then(function (j) {
        if (!r.ok || (j && j.status === 'error')) {
          throw new Error((j && j.message) || ('HTTP ' + r.status));
        }
        return j || {};
      });
    }).then(function (j) { load(); return j; })
      // null = the write did NOT happen; callers must not treat it as success
      // (the add form used to clear itself after a failed save).
      .catch(function (e) { banner(String(e.message || e)); return null; })
      .finally(function () { if (btn) btn.disabled = false; });
  }

  $('me').addEventListener('change', function () {
    localStorage.setItem(ME_KEY, $('me').value);
    renderList();
  });

  $('projFilter').addEventListener('change', renderList);

  $('refreshBtn').addEventListener('click', function () { load(); });

  // An iOS home-screen PWA is usually RESUMED, not reloaded: load() ran once at
  // first launch and the cards on screen can be days old. Task 173 was written
  // to the DB on 8/12 and served correctly by the API, but never appeared here
  // for exactly this reason. Re-fetch whenever the app comes back to the front
  // after being away longer than STALE_MS. pageshow covers the bfcache restore
  // that fires no visibilitychange.
  function refreshIfStale() {
    if (document.visibilityState !== 'visible') return;
    if (Date.now() - lastLoad < STALE_MS) return;
    load();
  }
  document.addEventListener('visibilitychange', refreshIfStale);
  window.addEventListener('pageshow', function (e) { if (e.persisted) refreshIfStale(); });

  $('list').addEventListener('change', function (e) {
    var sel = e.target.closest('select.proj-sel');
    if (!sel) return;
    var taskId = parseInt(sel.dataset.task, 10);
    if (sel.value === '__new') {
      var name = (prompt('New project name:') || '').trim();
      if (!name) { renderList(); return; }
      post({ action: 'add_project', name: name }, sel).then(function (j) {
        // add returns the bare RETURNING row {id, slug, name, status}
        var created = j && (j.result || j);
        if (!created || !created.id) { renderList(); return; }
        setProject(taskId, created.id, null);
      });
      return;
    }
    setProject(taskId, sel.value, sel);
  });

  $('f_go').addEventListener('click', function () {
    // Trim everything (hard rule: mobile autofill appends trailing spaces).
    var title = $('f_title').value.trim();
    if (!title) { banner('Title required'); return; }
    var due = $('f_due').value.trim();
    if ($('f_hard').checked && !due) { banner('Hard deadline needs a due date'); return; }
    if ($('f_recur').value && !due) { banner('Repeat needs a due date'); return; }
    var nb = $('f_nb').value.trim();
    if (nb && due && nb > due) { banner('Not-before must be on or before the due date'); return; }
    post({
      action: 'add',
      title: title,
      detail: $('f_detail').value.trim(),
      category_id: $('f_cat').value,
      created_by: me(),
      assigned_to: $('f_assign').value,
      due_date: due,
      not_before: nb,
      hard_deadline: $('f_hard').checked,
      effort_minutes: $('f_effort').value.trim(),
      weather_rule: $('f_wx').value,
      visibility: $('f_priv').checked ? 'private' : 'shared',
      recur_interval: $('f_recur').value,
    }, $('f_go')).then(function (j) {
      if (!j) return;  // save failed — keep what was typed
      ['f_title', 'f_due', 'f_nb', 'f_effort', 'f_detail'].forEach(function (id) { $(id).value = ''; });
      $('f_hard').checked = false; $('f_priv').checked = false;
      $('f_wx').value = 'none'; $('f_recur').value = '';
    });
  });

  $('list').addEventListener('click', function (e) {
    var btn = e.target.closest('button');
    if (!btn) return;
    if (btn.dataset.done) {
      var id = parseInt(btn.dataset.done, 10);
      var task = state.tasks.filter(function (t) { return String(t.task_id) === String(id); })[0];
      // Completing a repeating task schedules the next occurrence and moves the
      // deadline out of view — name it before closing it, don't trust the row.
      if (task && task.recur_interval
          && !confirm('Complete “' + task.title + '”?\n\nIt repeats every '
                      + String(task.recur_interval).replace(/mons?\b/, 'months')
                      + ', so the next one will be scheduled.')) return;
      post({ action: 'complete', task_id: id, user_id: me() }, btn).then(function (j) {
        if (!j || !j.result) return;
        banner('Completed “' + j.result.title + '”'
               + (j.result.next_due_date ? ' — next one due ' + j.result.next_due_date : ''), 'ok');
      });
    } else if (btn.dataset.cancel) {
      if (confirm('Cancel this task? (It is removed, not completed.)')) {
        // user_id is required now: cancel goes through tasks.archive_task, which
        // refuses an unattributed write. It used to be a raw UPDATE and the
        // history recorded it as nursery/direct-update (V015). Same as complete,
        // the server names the row it actually closed.
        post({ action: 'cancel', task_id: parseInt(btn.dataset.cancel, 10), user_id: me() }, btn)
          .then(function (j) {
            if (!j || !j.result) return;
            banner('Cancelled “' + j.result.title + '”', 'ok');
          });
      }
    }
  });

  load();
})();
</script>
</body>
</html>
