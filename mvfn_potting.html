<!DOCTYPE html>

<link rel="preconnect" href="https://fonts.googleapis.com">

<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@300;400;500&family=Fraunces:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: 'DM Mono', monospace; background: #f5f5f0; color: #2d3319; min-height: 100vh; }
  h1, h2, h3 { font-family: 'Fraunces', serif; }

  .container { max-width: 640px; margin: 0 auto; padding: 20px 16px 80px; }
  header { text-align: center; padding: 18px 0 6px; }
  header h1 { font-size: 1.9rem; font-weight: 700; }
  header .subtitle { font-size: 0.82rem; color: #5a6b2d; margin-top: 4px; }

  .lockbar { display: flex; align-items: center; justify-content: center; gap: 8px;
    flex-wrap: wrap; font-size: 0.78rem; margin: 6px 0 14px; }
  .lockbar button { padding: 7px 14px; border: 2px solid #2d3319; background: white; color: #2d3319;
    border-radius: 999px; font-family: 'Fraunces', serif; font-size: 0.8rem; font-weight: 600; cursor: pointer; }

  .tabs { display: flex; gap: 0; margin-bottom: 14px; border: 2px solid #2d3319;
    border-radius: 999px; overflow: hidden; }
  .tabs button { flex: 1 1 0; padding: 10px 8px; border: 0; background: white; color: #2d3319;
    font-family: 'Fraunces', serif; font-size: 0.9rem; font-weight: 600; cursor: pointer; }
  .tabs button + button { border-left: 2px solid #2d3319; }
  .tabs button.on { background: #2d3319; color: #f5f5f0; }
  .tabs button .n { font-family: 'DM Mono', monospace; font-weight: 400; opacity: .7;
    font-size: 0.76rem; margin-left: 5px; }

  .search { width: 100%; padding: 12px 14px; border: 2px solid #2d3319; border-radius: 10px;
    font-family: 'DM Mono', monospace; font-size: 0.95rem; background: white; margin-bottom: 12px; }

  .card { background: white; border: 2px solid #2d3319; border-radius: 12px;
    padding: 15px 16px; margin-bottom: 12px; }
  .card h3 { font-size: 1.05rem; font-weight: 600; line-height: 1.25; }
  .sci { font-family: 'Fraunces', serif; font-style: italic; font-size: 0.8rem;
    color: #6b7280; display: block; font-weight: 400; }

  .sp-row { display: flex; align-items: center; gap: 8px; padding: 11px 12px;
    background: white; border: 2px solid #d1d5db; border-radius: 10px; margin-bottom: 8px; cursor: pointer; }
  .sp-row:active { border-color: #2d3319; }
  .sp-row .nm { flex: 1 1 auto; font-size: 0.9rem; }
  .sp-row .qty { font-size: 0.72rem; color: #6b7280; white-space: nowrap; }

  .tag { font-size: 0.62rem; letter-spacing: .06em; text-transform: uppercase;
    padding: 3px 7px; border-radius: 4px; white-space: nowrap; }
  .tag.exception { background: #fbeccd; color: #8a5a12; }
  .tag.default   { background: #eceff0; color: #6b7280; }
  .tag.low       { background: #fadcd6; color: #9e3b2c; }
  .tag.uncounted { background: #eceff0; color: #6b7280; }
  .tag.ok        { background: #dcefd6; color: #2f6b28; }
  .tag.task      { background: #dde6ef; color: #2f4a6b; }

  .backlink { display: inline-block; margin-bottom: 10px; font-size: 0.8rem;
    color: #5a6b2d; cursor: pointer; text-decoration: underline; }

  .gline { display: flex; gap: 8px; margin-top: 10px; font-size: 0.82rem; line-height: 1.55; }
  .gline .k { flex: 0 0 74px; color: #9ca3af; font-size: 0.72rem; text-transform: uppercase;
    letter-spacing: .08em; padding-top: 2px; }
  .gline .v { flex: 1 1 auto; }
  .gline .v b { font-weight: 500; }
  .exc { background: #fdf6e7; border-left: 3px solid #8a5a12; padding: 8px 10px;
    border-radius: 4px; color: #7a4f10; }
  .recipe { font-size: 0.73rem; color: #6b7280; margin-top: 3px; }

  .prog-chips { display: flex; gap: 6px; flex-wrap: wrap; }
  .prog-chips span { padding: 4px 9px; border: 1.5px solid #d1d5db; border-radius: 999px;
    font-size: 0.74rem; color: #6b7280; }
  .prog-chips span.next { border-color: #2d3319; color: #2d3319; font-weight: 500; background: #f2f5ec; }

  .editlink { font-size: 0.74rem; color: #5a6b2d; text-decoration: underline; cursor: pointer;
    display: inline-block; margin-top: 10px; }

  .group { margin-top: 13px; }
  .group .label { font-size: 0.7rem; letter-spacing: .1em; text-transform: uppercase;
    color: #6b7280; margin-bottom: 6px; }
  select, input[type=text], input[type=number], input[type=date] {
    width: 100%; padding: 10px 11px; border: 2px solid #d1d5db; border-radius: 8px;
    font-family: 'DM Mono', monospace; font-size: 0.85rem; background: white; color: #2d3319; }
  .half { display: flex; gap: 8px; }
  .half > div { flex: 1 1 0; }
  .checkline { display: flex; align-items: center; gap: 9px; margin-top: 13px;
    font-size: 0.85rem; color: #2d3319; cursor: pointer; }
  .checkline input[type=checkbox] { width: 19px; height: 19px; accent-color: #2d3319; }
  .checkline .hint { font-size: 0.72rem; color: #6b7280; }

  .preflight { margin-top: 12px; display: flex; gap: 6px; flex-wrap: wrap; }
  .chip { padding: 7px 11px; border-radius: 8px; font-size: 0.76rem; line-height: 1.4; }
  .chip.ok        { background: #dcefd6; color: #2f6b28; }
  .chip.short     { background: #fadcd6; color: #9e3b2c; font-weight: 500; }
  .chip.uncounted { background: #eceff0; color: #6b7280; }

  .actions { display: flex; gap: 8px; margin-top: 14px; flex-wrap: wrap; }
  .actions button { padding: 12px 16px; border-radius: 999px; cursor: pointer;
    font-family: 'Fraunces', serif; font-size: 0.9rem; font-weight: 600; border: 2px solid #2d3319; }
  .btn-primary { background: #2d3319; color: #f5f5f0; flex: 1 1 auto; }
  .btn-primary:disabled { opacity: .55; }
  .btn-plain { background: white; color: #2d3319; }
  .btn-danger { background: white; color: #9e3b2c; border-color: #9e3b2c; }

  .result { background: #f2f5ec; border: 2px solid #5a6b2d; border-radius: 12px;
    padding: 15px 16px; margin-bottom: 12px; }
  .result h3 { color: #4b6b1f; margin-bottom: 8px; }
  .result .line { font-size: 0.82rem; margin-top: 5px; line-height: 1.5; }
  .result .warn { color: #8a5a12; }
  .result .task { color: #2f4a6b; }

  .sup-row { background: white; border: 2px solid #d1d5db; border-radius: 10px;
    padding: 11px 12px; margin-bottom: 8px; }
  .sup-row.low { border-color: #9e3b2c; }
  .sup-row .top { display: flex; align-items: center; gap: 8px; cursor: pointer; }
  .sup-row .nm { flex: 1 1 auto; font-size: 0.86rem; }
  .sup-row .cnt { font-size: 0.86rem; white-space: nowrap; }
  .sup-row .cnt small { color: #9ca3af; font-size: 0.7rem; }
  .sup-edit { margin-top: 10px; border-top: 1.5px dashed #d1d5db; padding-top: 10px; }
  .sup-edit .row { display: flex; gap: 8px; align-items: center; margin-top: 8px; }
  .sup-edit .row label { flex: 0 0 92px; font-size: 0.72rem; color: #6b7280;
    text-transform: uppercase; letter-spacing: .06em; }
  .sup-edit .row input { flex: 1 1 auto; }
  .sup-edit .row button { padding: 9px 14px; border-radius: 8px; border: 2px solid #2d3319;
    background: #2d3319; color: #f5f5f0; font-family: 'Fraunces', serif; font-size: 0.8rem;
    font-weight: 600; cursor: pointer; white-space: nowrap; }
  .kindhead { font-family: 'Fraunces', serif; font-size: 0.95rem; font-weight: 600;
    margin: 16px 0 8px; }

  .msg { text-align: center; padding: 26px 10px; color: #6b7280; font-size: 0.85rem; }
  .toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: 22px;
    background: #2d3319; color: #f5f5f0; padding: 11px 18px; border-radius: 999px;
    font-size: 0.8rem; opacity: 0; pointer-events: none; transition: opacity .25s ease;
    z-index: 50; max-width: 90vw; }
  .toast.show { opacity: 1; }
  .toast.err { background: #9e3b2c; }

  /* failed writes: pinned until dismissed (see "failed writes" in the script) */
  .pinned { position: sticky; top: 8px; z-index: 40; }
  .queued { display: flex; gap: 10px; align-items: flex-start; background: #fbeccd; color: #6b4410;
    border: 2px solid #8a5a12; padding: 10px 12px; border-radius: 10px; margin-bottom: 8px;
    font-size: 0.8rem; line-height: 1.45; box-shadow: 0 2px 8px rgba(0, 0, 0, .12); }
  .queued .what { flex: 1 1 auto; }
  .queued .what b { font-weight: 500; }
  .queued .qline { margin-top: 4px; }
  .queued button { flex: 0 0 auto; background: white; color: #6b4410; border: 1.5px solid #8a5a12;
    border-radius: 999px; padding: 4px 11px; font-family: 'DM Mono', monospace; font-size: 0.72rem;
    cursor: pointer; }
  .queued .qdrop { margin-left: 8px; padding: 1px 8px; font-size: 0.66rem; }
  .result.queued-card { background: #fdf6e7; border-color: #8a5a12; }
  .result.queued-card h3 { color: #8a5a12; }
  .fail { display: flex; gap: 10px; align-items: flex-start; background: #9e3b2c; color: #f5f5f0;
    padding: 11px 13px; border-radius: 10px; margin-bottom: 8px; font-size: 0.8rem; line-height: 1.45;
    box-shadow: 0 2px 8px rgba(0, 0, 0, .18); }
  .fail .what { flex: 1 1 auto; }
  .fail .what b { font-weight: 500; }
  .fail .why { opacity: .92; margin-top: 2px; }
  .fail button { flex: 0 0 auto; background: transparent; color: #f5f5f0; border: 1.5px solid #f5f5f0;
    border-radius: 999px; padding: 4px 11px; font-family: 'DM Mono', monospace; font-size: 0.72rem;
    cursor: pointer; }
</style>

<body>
<div class="container">

  <header>
    <h1>Potting Bench</h1>
    <div class="subtitle">Guidance, supplies, and the record — one stop</div>
  </header>

  <div class="lockbar">
    <span id="lockstate"></span>
    <button type="button" onclick="window.mvfnLock()">Lock</button>
    <button type="button" onclick="window.appLoad()">Reload</button>
  </div>

  <div class="pinned">
    <div id="outbox"></div>
    <div class="fails" id="fails" aria-live="assertive"></div>
  </div>

  <div class="tabs" id="tabs"></div>

  <div id="tab-pot"></div>
  <div id="tab-supplies" style="display:none"></div>
</div>

<div class="toast" id="toast"></div>

<script>
(function () {
  'use strict';

  const N8N_BASE = 'https://homelab.taile865b6.ts.net:5678/webhook';
  const ME = 'ian';
  const POST_TIMEOUT_MS = 20000;   // a save with no answer by then waits in the outbox

  const state = {
    data: null,          // GET payload
    tab: 'pot',
    speciesId: null,
    editGuidance: false,
    form: {},            // batch form values
    result: null,        // last record_pot_up result
    expanded: null,      // expanded supply row id
    addingItem: false,
    search: ''
  };

  const $ = id => document.getElementById(id);
  const trim = v => (v == null ? '' : String(v)).trim();

  function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"]/g,
      ch => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[ch]));
  }

  function toast(text, isErr) {
    const t = $('toast');
    t.textContent = text;
    t.className = 'toast show' + (isErr ? ' err' : '');
    setTimeout(() => { t.className = 'toast'; }, isErr ? 3500 : 2000);
  }

  // ── failed writes ──────────────────────────────────────────────────────────
  // A failed write used to be a toast that faded after 3.5 s. That is how two
  // batches were lost on 2026-09-10: tap Record, look away, the error came and
  // went, nothing was saved. A failed WRITE now pins a banner that stays until
  // it's dismissed, or until that same thing is saved successfully. Banners
  // stack, because two failures in a row is exactly what happened. Validation
  // nags stay as toasts: nothing was sent, and the form is right there.
  const fails = [];
  let failSeq = 0;
  const sentence = t => (/[.!?]$/.test(t) ? t : t + '.');
  const spName = id => { const s = speciesById(id); return s ? (s.common_name || s.species_id) : id; };
  const supLabel = id => {
    const s = ((state.data && state.data.supplies) || []).find(x => x.supply_id === id);
    return s ? s.label : id;
  };

  function renderFails() {
    const el = $('fails');
    el.innerHTML = fails.map(x =>
      '<div class="fail" role="alert"><div class="what"><b>' + esc(x.what) + '</b> · ' + esc(x.at) +
      '<div class="why">' + esc(sentence(x.why)) + (x.hint ? ' ' + esc(x.hint) : '') + '</div></div>' +
      '<button type="button" data-f="' + x.id + '">Dismiss</button></div>').join('');
    el.querySelectorAll('button').forEach(b => {
      b.onclick = () => {
        const i = fails.findIndex(x => String(x.id) === b.getAttribute('data-f'));
        if (i >= 0) fails.splice(i, 1);
        renderFails();
      };
    });
  }

  // key ties a failure to the thing that failed, so re-saving it clears it
  function failed(what, err, key, hint) {
    fails.unshift({
      id: ++failSeq, key: key, what: what, hint: hint || '',
      why: String((err && err.message) || err || 'unknown error'),
      at: new Date().toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' })
    });
    renderFails();
    if (navigator.vibrate) navigator.vibrate([180, 90, 180]);
  }

  function clearFails(key) {
    for (let i = fails.length - 1; i >= 0; i--) if (fails[i].key === key) fails.splice(i, 1);
    renderFails();
  }

  // ── outbox ─────────────────────────────────────────────────────────────────
  // Every batch is written to this phone BEFORE it is sent, and removed only
  // when the server confirms it -- or refuses it outright (409). Anything that
  // got no clear answer (no signal, timeout, 5xx, empty reply) stays and is
  // resent by itself: on load, when the phone comes back online, when the app
  // is reopened, and every 30 s while something is waiting. Resending is safe
  // because each batch carries a client_ref and the server (V157) answers a ref
  // it already has with the original event instead of potting the plants twice.
  // Pot-ups only: supply receives are deltas done with the item in hand, so
  // they stay send-or-banner.
  const OUTBOX_KEY = 'mvfn_potting_outbox_v1';
  const inFlight = new Set();
  let flushing = false;
  const localDate = d => {
    const z = n => String(n).padStart(2, '0');
    return d.getFullYear() + '-' + z(d.getMonth() + 1) + '-' + z(d.getDate());
  };
  const shortDay = v => {
    const p = String(v || '').split('-');
    return p.length === 3 ? (+p[1]) + '/' + (+p[2]) : String(v || '');
  };
  const newRef = () => (window.crypto && crypto.randomUUID) ? crypto.randomUUID()
    : 'pb-' + Date.now().toString(36) + '-' + Math.random().toString(36).slice(2, 10);

  function readOutbox() {
    try { return JSON.parse(localStorage.getItem(OUTBOX_KEY) || '[]') || []; } catch (e) { return []; }
  }
  function writeOutbox(list) {
    try { localStorage.setItem(OUTBOX_KEY, JSON.stringify(list)); return true; } catch (e) { return false; }
  }
  const enqueue = entry => writeOutbox(readOutbox().concat([entry]));   // false = this phone can't keep it
  const dequeue = ref => writeOutbox(readOutbox().filter(x => x.ref !== ref));
  const noteTry = (ref, why) => writeOutbox(readOutbox().map(x =>
    x.ref === ref ? Object.assign({}, x, { tries: (x.tries || 0) + 1, lastError: why }) : x));

  function renderOutbox() {
    const el = $('outbox');
    const list = readOutbox();
    if (!list.length) { el.innerHTML = ''; return; }
    el.innerHTML = '<div class="queued" role="status"><div class="what"><b>' +
      (list.length === 1 ? '1 batch' : list.length + ' batches') + ' saved on this phone, not sent yet</b>' +
      '<div class="why">They send by themselves when there’s signal.</div>' +
      list.map(x => '<div class="qline">' + esc(x.what) + ' · ' + esc(shortDay(x.day)) +
        '<button type="button" class="qdrop" data-ref="' + esc(x.ref) + '">Discard</button></div>').join('') +
      '</div><button type="button" id="ob-send">Send now</button></div>';
    $('ob-send').onclick = () => flushOutbox();
    el.querySelectorAll('.qdrop').forEach(b => {
      b.onclick = () => {
        const x = readOutbox().find(y => y.ref === b.getAttribute('data-ref'));
        if (x && window.confirm('Discard this saved batch?\n\n' + x.what + ' · ' + shortDay(x.day) +
            '\n\nThe server hasn’t confirmed it, so discarding may lose it.')) {
          dequeue(x.ref);
          renderOutbox();
        }
      };
    });
  }

  // one send attempt; the outbox entry is settled here, the caller decides what to show
  async function sendEntry(entry) {
    if (inFlight.has(entry.ref)) return { ok: false, retry: true, busy: true };
    inFlight.add(entry.ref);
    try {
      const data = await postAction(entry.payload);
      dequeue(entry.ref);
      clearFails('pot:' + entry.payload.species_id);
      return { ok: true, result: data.result || data };
    } catch (e) {
      if (e.retryable) { noteTry(entry.ref, e.message); return { ok: false, retry: true, error: e }; }
      dequeue(entry.ref);
      return { ok: false, retry: false, error: e };
    } finally {
      inFlight.delete(entry.ref);
      renderOutbox();
    }
  }

  async function flushOutbox() {
    if (flushing) return;
    flushing = true;
    let sent = 0;
    try {
      for (const entry of readOutbox()) {
        const out = await sendEntry(entry);
        if (out.ok) {
          sent++;
          // the card for this very batch is on screen: swap in the real result
          if (state.result && state.result.queued && state.result.ref === entry.ref) {
            state.result = out.result;
            render();
          }
        } else if (!out.retry) {
          failed(entry.what + ' NOT recorded', out.error, 'pot:' + entry.payload.species_id,
                 'It was saved on this phone, but the server refused it — record it again.');
        } else if (!out.busy) {
          break;   // still no connection: leave the rest for the next try
        }
      }
    } finally {
      flushing = false;
    }
    if (sent) {
      toast(sent === 1 ? 'Sent 1 saved batch' : 'Sent ' + sent + ' saved batches');
      load(true);
    }
  }

  // ── data access ────────────────────────────────────────────────────────────
  const speciesById = id => (state.data.species || []).find(s => s.species_id === id);
  const guidanceOf = id => (state.data.guidance || []).find(g => g.species_id === id);
  const stockOf = id => (state.data.stock || []).filter(s => s.species_id === id);
  const supplyByContainer = cid => (state.data.supplies || []).find(s => s.container_id === cid);
  const supplyBySpecies = sid => (state.data.supplies || []).find(s => s.species_id === sid);

  // ── network ────────────────────────────────────────────────────────────────
  // Errors carry .retryable: true when the write may not have landed (no answer,
  // timeout, 5xx, empty reply) -- safe to resend a pot-up now that it's
  // idempotent (V157); false only for a 409, the server refusing it outright.
  async function postAction(payload) {
    const ctl = typeof AbortController === 'function' ? new AbortController() : null;
    const timer = ctl ? setTimeout(() => ctl.abort(), POST_TIMEOUT_MS) : null;
    const fail = (msg, retryable) => { const e = new Error(msg); e.retryable = retryable; return e; };
    let res, text;
    try {
      res = await fetch(N8N_BASE + '/mvfn-potting', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload),
        signal: ctl ? ctl.signal : undefined
      });
      text = await res.text();
    } catch (e) {
      // no HTTP answer at all: no signal, Tailscale off, dropped mid-request, or our timeout
      throw fail(ctl && ctl.signal.aborted
        ? 'timed out — the server didn’t answer in ' + (POST_TIMEOUT_MS / 1000) + ' s'
        : 'no connection — the server never answered', true);
    } finally {
      if (timer) clearTimeout(timer);
    }
    let data = null;
    try { data = text ? JSON.parse(text) : null; } catch (e) { data = null; }
    if (!res.ok) {
      const msg = (data && ((data.result && data.result.message) || data.message)) ||
                  ('server error ' + res.status);
      throw fail(msg, res.status !== 409);
    }
    if (data === null) throw fail('empty response — the save may not have landed', true);
    return data;
  }

  async function load(quiet) {
    if (!quiet) {
      $('tab-pot').innerHTML = '<div class="msg">Loading…</div>';
      $('tab-supplies').innerHTML = '';
    }
    try {
      const res = await fetch(N8N_BASE + '/mvfn-get-potting');
      if (!res.ok) throw new Error('HTTP ' + res.status);
      state.data = await res.json();
      $('lockstate').textContent = 'unlocked';
      render();
    } catch (e) {
      if (!quiet) {
        $('tab-pot').innerHTML = '<div class="msg">Couldn’t reach the bench (' +
          esc(e.message) + ').<br>Check your Tailscale connection.</div>';
      }
    }
  }

  // ── tabs ───────────────────────────────────────────────────────────────────
  function renderTabs() {
    const low = (state.data.supplies || []).filter(s => s.below_reorder).length;
    $('tabs').innerHTML =
      '<button type="button" data-t="pot"' + (state.tab === 'pot' ? ' class="on"' : '') + '>Pot Up</button>' +
      '<button type="button" data-t="supplies"' + (state.tab === 'supplies' ? ' class="on"' : '') + '>Supplies' +
      (low ? '<span class="n">' + low + ' low</span>' : '') + '</button>';
    $('tabs').querySelectorAll('button').forEach(b => {
      b.onclick = () => { state.tab = b.getAttribute('data-t'); render(); };
    });
  }

  // ── species picker ─────────────────────────────────────────────────────────
  function speciesListHtml() {
    const q = state.search.toLowerCase();
    const withStock = {};
    (state.data.stock || []).forEach(s => {
      withStock[s.species_id] = (withStock[s.species_id] || 0) + (s.quantity || 0);
    });
    let rows = (state.data.species || []).filter(s => {
      if (!q) return true;
      return (s.common_name || '').toLowerCase().includes(q) ||
             (s.scientific_name || '').toLowerCase().includes(q) ||
             s.species_id.toLowerCase().includes(q);
    });
    // alphabetical by common name — matches what's written on a prop-flat tag
    rows.sort((a, b) =>
      (a.common_name || a.species_id).localeCompare(b.common_name || b.species_id));
    if (!rows.length) return '<div class="msg">No species match.</div>';
    return rows.map(s => {
      const g = guidanceOf(s.species_id);
      const qty = withStock[s.species_id];
      return '<div class="sp-row" data-sp="' + esc(s.species_id) + '">' +
        '<div class="nm">' + esc(s.common_name || s.species_id) +
        '<span class="sci">' + esc(s.scientific_name || '') + '</span></div>' +
        (qty ? '<span class="qty">' + qty + ' in stock</span>' : '') +
        (g ? '<span class="tag exception">exceptions</span>' : '') +
        '</div>';
    }).join('');
  }

  // ── guidance card ──────────────────────────────────────────────────────────
  function resolvedMix(sid) {
    const g = guidanceOf(sid);
    const d = state.data.defaults || {};
    if (g && g.mix_material_id) {
      const m = (state.data.materials || []).find(x => x.material_id === g.mix_material_id);
      return { id: g.mix_material_id, label: m ? m.product_name : g.mix_material_id,
               notes: m ? m.notes : '', isException: true };
    }
    return { id: d.mix_material_id, label: d.mix_product || 'house mix',
             notes: d.mix_notes || '', isException: false };
  }

  function guidanceHtml(sid) {
    const g = guidanceOf(sid);
    const d = state.data.defaults || {};
    const mix = resolvedMix(sid);
    let h = '';
    h += '<div class="gline"><div class="k">Mix</div><div class="v">' +
      (mix.isException
        ? '<div class="exc"><b>' + esc(mix.label) + '</b> — species exception, not the house mix.</div>'
        : '<b>' + esc(mix.label) + '</b> (house default)') +
      '</div></div>';
    h += '<div class="gline"><div class="k">Fertilizer</div><div class="v">' +
      (g && g.fert_note
        ? '<div class="exc">' + esc(g.fert_note) + '</div>'
        : esc(d.fert_note || '—')) +
      '</div></div>';
    if (g && g.container_progression && g.container_progression.length) {
      const next = suggestedNext(sid);
      h += '<div class="gline"><div class="k">Pots</div><div class="v"><div class="prog-chips">' +
        g.container_progression.map(c =>
          '<span' + (c === next ? ' class="next"' : '') + '>' + esc(c) + '</span>'
        ).join('') + '</div></div></div>';
    }
    if (g && g.season_note) {
      h += '<div class="gline"><div class="k">Season</div><div class="v">' + esc(g.season_note) + '</div></div>';
    }
    if (g && g.note) {
      h += '<div class="gline"><div class="k">Note</div><div class="v">' + esc(g.note) + '</div></div>';
    }
    if (g) {
      h += '<div class="gline"><div class="k"></div><div class="v" style="font-size:.72rem;color:#6b7280">' +
        'Confirmed by ' + esc(g.confirmed_by) +
        (g.confirmed_at ? ' · ' + esc(String(g.confirmed_at).slice(0, 10)) : '') + '</div></div>';
    }
    h += '<span class="editlink" id="edit-guidance">' +
         (g ? 'Edit exceptions' : 'Add a species exception') + '</span>';
    return h;
  }

  function guidanceEditHtml(sid) {
    const g = guidanceOf(sid) || {};
    // the house mix is already the "(default)" option — listing its material
    // again would look like a second house mix
    const houseMix = (state.data.defaults || {}).mix_material_id;
    const mats = (state.data.materials || []).filter(m => m.material_id !== houseMix);
    let h = '<div class="group"><div class="label">Mix override (blank = house mix)</div>' +
      '<select id="ge-mix"><option value="">house mix (default)</option>' +
      mats.map(m => '<option value="' + esc(m.material_id) + '"' +
        (g.mix_material_id === m.material_id ? ' selected' : '') + '>' +
        esc(m.product_name) + '</option>').join('') + '</select></div>';
    h += '<div class="group"><div class="label">Fertilizer exception (blank = default regimen)</div>' +
      '<input type="text" id="ge-fert" placeholder="e.g. No Multicote top-dress" value="' +
      esc(g.fert_note || '') + '"></div>';
    h += '<div class="group"><div class="label">Pot progression, comma-separated container codes</div>' +
      '<input type="text" id="ge-prog" placeholder="e.g. NSC300, NSC1000" value="' +
      esc((g.container_progression || []).join(', ')) + '"></div>';
    h += '<div class="group"><div class="label">Season note</div>' +
      '<input type="text" id="ge-season" placeholder="e.g. bump in spring only" value="' +
      esc(g.season_note || '') + '"></div>';
    h += '<div class="group"><div class="label">Other note</div>' +
      '<input type="text" id="ge-note" value="' + esc(g.note || '') + '"></div>';
    h += '<div class="actions">' +
      '<button type="button" class="btn-primary" id="ge-save">Save exceptions</button>' +
      (guidanceOf(sid) ? '<button type="button" class="btn-danger" id="ge-clear">Remove all</button>' : '') +
      '<button type="button" class="btn-plain" id="ge-cancel">Cancel</button></div>';
    return h;
  }

  function suggestedNext(sid) {
    const g = guidanceOf(sid);
    if (!g || !g.container_progression || !g.container_progression.length) return null;
    const prog = g.container_progression;
    const fromId = state.form.from_stock_id;
    if (fromId) {
      const src = (state.data.stock || []).find(s => s.stock_id === Number(fromId));
      if (src && src.container_id) {
        const i = prog.indexOf(src.container_id);
        if (i >= 0 && i + 1 < prog.length) return prog[i + 1];
        if (i === prog.length - 1) return null;
      }
    }
    return prog[0];
  }

  // ── batch form ─────────────────────────────────────────────────────────────
  function batchFormHtml(sid) {
    const rows = stockOf(sid);
    const f = state.form;
    const containers = state.data.containers || [];
    let h = '<div class="group"><div class="label">Potting from</div><select id="bf-from">' +
      '<option value=""' + (!f.from_stock_id ? ' selected' : '') +
      '>Not in stock — prop tray / other</option>' +
      rows.map(s =>
        '<option value="' + s.stock_id + '"' +
        (String(f.from_stock_id) === String(s.stock_id) ? ' selected' : '') + '>' +
        esc((s.container_id || s.container_size || '?') + ' · ' + s.quantity + ' on hand · ' +
            s.status + (s.location ? ' · ' + s.location : '')) +
        '</option>').join('') + '</select></div>';
    if (!f.from_stock_id) {
      h += '<div class="group"><div class="label">Source note</div>' +
        '<input type="text" id="bf-fromnote" placeholder="e.g. prop tray A" value="' +
        esc(f.from_note || '') + '"></div>';
    } else {
      h += '<label class="checkline"><input type="checkbox" id="bf-usedup"' +
        (usedUpChecked(f) ? ' checked' : '') + '> Source used up — close it out' +
        '</label>';
    }
    h += '<div class="group"><div class="label">Into container</div><select id="bf-to">' +
      '<option value="">pick…</option>' +
      containers.map(c => '<option value="' + esc(c.container_id) + '"' +
        (f.to_container_id === c.container_id ? ' selected' : '') + '>' +
        esc(c.container_id + (c.label && c.label !== c.container_id ? ' — ' + c.label : '')) +
        '</option>').join('') + '</select></div>';
    h += '<div class="half">' +
      '<div class="group"><div class="label">Plants</div>' +
      '<input type="number" id="bf-qty" min="1" inputmode="numeric" value="' + esc(f.qty || '') + '"></div>' +
      '<div class="group"><div class="label">Tags used</div>' +
      '<input type="number" id="bf-tags" min="0" inputmode="numeric" placeholder="= plants" value="' +
      esc(f.tags_used == null ? '' : f.tags_used) + '"></div></div>';
    // Controlled list (inventory.location, V154): Bench Book zones + retail.
    // Active codes are offered; a legacy code prefilled from the source row
    // stays selectable so the form never rewrites it behind Ian's back.
    var curLoc = f.location || '';
    var locs = (state.data.locations || []).filter(function (l) { return l.active || l.code === curLoc; });
    if (curLoc && !locs.some(function (l) { return l.code === curLoc; })) locs.push({ code: curLoc, label: curLoc + ' (not in list)' });
    h += '<div class="group"><div class="label">Location (optional)</div>' +
      '<select id="bf-loc"><option value="">— none —</option>' +
      locs.map(function (l) {
        return '<option value="' + esc(l.code) + '"' + (l.code === curLoc ? ' selected' : '') + '>' + esc(l.label) + '</option>';
      }).join('') + '</select></div>';
    h += '<div class="group"><div class="label">Potted on</div>' +
      '<input type="date" id="bf-date" max="' + localDate(new Date()) + '" value="' +
      esc(f.event_date || localDate(new Date())) + '"></div>';
    h += '<div class="group"><div class="label">Ready by (optional)</div>' +
      '<input type="date" id="bf-ready" value="' + esc(f.ready_date || '') + '"></div>';
    h += '<div class="group"><div class="label">Note (optional)</div>' +
      '<input type="text" id="bf-note" value="' + esc(f.note || '') + '"></div>';
    h += '<div class="preflight" id="preflight"></div>';
    h += '<div class="actions"><button type="button" class="btn-primary" id="bf-save">Record batch</button></div>';
    return h;
  }

  // "source used up" default: a batch at least as big as the source's count
  // usually consumed it (flats recorded as 1, whole-row divisions)
  function usedUpDefault(f) {
    const src = (state.data.stock || []).find(s => s.stock_id === Number(f.from_stock_id));
    const qty = parseInt(f.qty, 10) || 0;
    return !!src && qty > 0 && qty >= src.quantity;
  }

  function usedUpChecked(f) {
    return f.source_used_up_touched ? !!f.source_used_up : usedUpDefault(f);
  }

  function preflightHtml(sid) {
    const f = state.form;
    const qty = parseInt(f.qty, 10) || 0;
    const tags = f.tags_used === '' || f.tags_used == null ? qty : (parseInt(f.tags_used, 10) || 0);
    if (!f.to_container_id || !qty) return '';
    const chips = [];
    const pot = supplyByContainer(f.to_container_id);
    if (!pot || pot.on_hand == null) {
      chips.push('<span class="chip uncounted">Pots ' + esc(f.to_container_id) + ': uncounted</span>');
    } else if (pot.on_hand < qty) {
      chips.push('<span class="chip short">Pots ' + esc(f.to_container_id) + ': need ' + qty +
        ', have ' + pot.on_hand + ' — SHORT ' + (qty - pot.on_hand) + '</span>');
    } else {
      chips.push('<span class="chip ok">Pots ' + esc(f.to_container_id) + ': ' + pot.on_hand +
        ' on hand</span>');
    }
    if (tags > 0) {
      const tag = supplyBySpecies(sid);
      if (!tag || tag.on_hand == null) {
        chips.push('<span class="chip uncounted">Tags: uncounted</span>');
      } else if (tag.on_hand < tags) {
        chips.push('<span class="chip short">Tags: need ' + tags + ', have ' + tag.on_hand +
          ' — SHORT ' + (tags - tag.on_hand) + '</span>');
      } else {
        chips.push('<span class="chip ok">Tags: ' + tag.on_hand + ' on hand</span>');
      }
    }
    if ((parseInt(f.from_stock_id, 10) || 0) > 0) {
      const src = (state.data.stock || []).find(s => s.stock_id === Number(f.from_stock_id));
      if (src && qty > src.quantity) {
        chips.push('<span class="chip short">Source has only ' + src.quantity + '</span>');
      }
    }
    return chips.join('');
  }

  function resultHtml(r) {
    if (r.queued) {
      return '<div class="result queued-card"><h3>Saved on this phone</h3>' +
        '<div class="line"><b>' + esc(r.what) + '</b> didn’t reach the server (' + esc(r.why) + ').</div>' +
        '<div class="line">It’s kept on this phone and sends by itself when there’s signal — nothing to ' +
        're-enter. Stock counts won’t include it until it’s sent.</div>' +
        '<div class="actions">' +
        '<button type="button" class="btn-primary" id="res-again">Pot another batch</button>' +
        '<button type="button" class="btn-plain" id="res-done">Done</button></div></div>';
    }
    let h = '<div class="result"><h3>' + (r.duplicate ? 'Already recorded' : 'Batch recorded') + '</h3>';
    h += '<div class="line">' + r.to_quantity + ' now in stock row #' + r.to_stock_id +
      (r.duplicate ? '' : (r.to_merged ? ' (merged into existing row)' : ' (new row)')) + '.</div>';
    if (r.from_stock) {
      h += r.from_stock.closed
        ? '<div class="line">Source row #' + r.from_stock.stock_id + ' used up — closed out.</div>'
        : '<div class="line">Source row #' + r.from_stock.stock_id + ' down to ' +
          r.from_stock.quantity + '.</div>';
    }
    (r.supplies || []).forEach(s => {
      h += '<div class="line">' + esc(s.supply_id) + ': ' + s.qty_delta + ' → ' +
        (s.on_hand == null ? 'uncounted' : s.on_hand + ' left') + '</div>';
    });
    (r.tasks_created || []).forEach(t => {
      h += '<div class="line task">Task proposed: ' + esc(t.title) + '</div>';
    });
    (r.warnings || []).forEach(w => {
      h += '<div class="line warn">' + esc(w) + '</div>';
    });
    h += '<div class="actions">' +
      '<button type="button" class="btn-primary" id="res-again">Pot another batch</button>' +
      '<button type="button" class="btn-plain" id="res-done">Done</button></div></div>';
    return h;
  }

  // ── pot tab ────────────────────────────────────────────────────────────────
  function renderPot() {
    const el = $('tab-pot');
    if (!state.speciesId) {
      el.innerHTML =
        '<input class="search" id="sp-search" type="text" placeholder="Search species…" value="' +
        esc(state.search) + '">' + '<div id="sp-list">' + speciesListHtml() + '</div>';
      const inp = $('sp-search');
      inp.oninput = () => {
        state.search = inp.value;
        $('sp-list').innerHTML = speciesListHtml();
        wireSpeciesRows();
      };
      wireSpeciesRows();
      return;
    }

    const s = speciesById(state.speciesId);
    let h = '<span class="backlink" id="back">&larr; all species</span>';
    h += '<div class="card"><h3>' + esc(s.common_name || s.species_id) +
      '<span class="sci">' + esc(s.scientific_name || '') + '</span></h3>' +
      (state.editGuidance ? guidanceEditHtml(s.species_id) : guidanceHtml(s.species_id)) + '</div>';
    if (state.result) {
      h += resultHtml(state.result);
    } else {
      h += '<div class="card">' + batchFormHtml(s.species_id) + '</div>';
    }
    el.innerHTML = h;

    $('back').onclick = () => {
      state.speciesId = null; state.result = null; state.form = {}; state.editGuidance = false;
      render();
    };
    if (state.editGuidance) wireGuidanceEdit(s.species_id);
    else {
      const e = $('edit-guidance');
      if (e) e.onclick = () => { state.editGuidance = true; render(); };
    }
    if (state.result) {
      $('res-again').onclick = () => {
        state.result = null;
        state.form.qty = ''; state.form.tags_used = null; state.form.note = '';
        render();
      };
      $('res-done').onclick = () => {
        state.speciesId = null; state.result = null; state.form = {};
        render();
      };
    } else {
      wireBatchForm(s.species_id);
    }
  }

  function wireSpeciesRows() {
    document.querySelectorAll('.sp-row').forEach(row => {
      row.onclick = () => {
        state.speciesId = row.getAttribute('data-sp');
        state.form = {};
        state.result = null;
        state.editGuidance = false;
        // preselect the biggest stock row as the likely source
        const rows = stockOf(state.speciesId).slice()
          .sort((a, b) => (b.quantity || 0) - (a.quantity || 0));
        if (rows.length) {
          state.form.from_stock_id = String(rows[0].stock_id);
          if (rows[0].location) state.form.location = rows[0].location;
        }
        const nxt = suggestedNext(state.speciesId);
        if (nxt) state.form.to_container_id = nxt;
        render();
      };
    });
  }

  function readBatchForm() {
    const f = state.form;
    f.from_stock_id = $('bf-from') ? $('bf-from').value : f.from_stock_id;
    if ($('bf-fromnote')) f.from_note = $('bf-fromnote').value;
    f.to_container_id = $('bf-to') ? $('bf-to').value : f.to_container_id;
    f.qty = $('bf-qty') ? $('bf-qty').value : f.qty;
    f.tags_used = $('bf-tags') ? ($('bf-tags').value === '' ? null : $('bf-tags').value) : f.tags_used;
    f.location = $('bf-loc') ? $('bf-loc').value : f.location;
    f.note = $('bf-note') ? $('bf-note').value : f.note;
    f.ready_date = $('bf-ready') ? $('bf-ready').value : f.ready_date;
    f.event_date = $('bf-date') ? $('bf-date').value : f.event_date;
    if ($('bf-usedup')) f.source_used_up = $('bf-usedup').checked;
  }

  function wireBatchForm(sid) {
    const refresh = () => {
      $('preflight').innerHTML = preflightHtml(sid);
      // the "used up" default tracks qty vs source count until Ian flips it
      if ($('bf-usedup') && !state.form.source_used_up_touched) {
        $('bf-usedup').checked = usedUpDefault(state.form);
      }
    };
    $('bf-from').onchange = () => {
      readBatchForm();
      state.form.source_used_up_touched = false;
      state.form.source_used_up = false;
      const nxt = suggestedNext(sid);
      if (nxt) state.form.to_container_id = nxt;
      render();
    };
    $('bf-to').onchange = () => { readBatchForm(); refresh(); };
    $('bf-qty').oninput = () => { readBatchForm(); refresh(); };
    $('bf-tags').oninput = () => { readBatchForm(); refresh(); };
    if ($('bf-fromnote')) $('bf-fromnote').oninput = () => readBatchForm();
    if ($('bf-usedup')) $('bf-usedup').onchange = () => {
      state.form.source_used_up = $('bf-usedup').checked;
      state.form.source_used_up_touched = true;
    };
    $('bf-loc').oninput = () => readBatchForm();
    $('bf-note').oninput = () => readBatchForm();
    $('bf-ready').onchange = () => readBatchForm();
    $('bf-date').onchange = () => readBatchForm();
    refresh();

    $('bf-save').onclick = async () => {
      readBatchForm();
      const f = state.form;
      const qty = parseInt(f.qty, 10) || 0;
      if (!f.to_container_id) { toast('Pick the destination container', true); return; }
      if (qty <= 0) { toast('How many plants?', true); return; }
      if (!f.from_stock_id && !trim(f.from_note)) {
        toast('Name the source — a stock row or a note', true); return;
      }
      // the batch's own day: stated on the form, else today HERE -- never the server's UTC date
      const day = trim(f.event_date) || localDate(new Date());
      if (day > localDate(new Date())) { toast('Potted-on date is in the future', true); return; }
      const btn = $('bf-save');
      btn.disabled = true; btn.textContent = 'Recording…';
      const payload = {
        action: 'record_pot_up',
        species_id: state.speciesId,
        to_container_id: f.to_container_id,
        qty: String(qty),
        performed_by: ME,
        from_stock_id: f.from_stock_id ? String(f.from_stock_id) : '',
        from_note: trim(f.from_note),
        mix_material_id: '',
        tags_used: f.tags_used == null ? '' : String(parseInt(f.tags_used, 10) || 0),
        to_status: 'growing',
        location: trim(f.location),
        note: trim(f.note),
        // '' = not stated -> NULL; the server never infers a ready date
        ready_date: trim(f.ready_date),
        // strings on purpose: the n8n (body.x || '') idiom turns a JSON
        // boolean false into '' (= auto server-side)
        source_used_up: f.from_stock_id ? String(usedUpChecked(f)) : '',
        // fixed when recorded, so a batch that waits in the outbox overnight
        // still lands on the day it was potted
        event_date: day,
        // one id per batch: a resend is recognised instead of recorded twice
        client_ref: newRef()
      };
      const entry = {
        ref: payload.client_ref, payload: payload, day: day,
        what: spName(payload.species_id) + ': ' + qty + ' → ' + f.to_container_id,
        queuedAt: Date.now(), tries: 0, lastError: ''
      };
      const kept = enqueue(entry);   // written BEFORE sending; false = this phone can't store it
      const out = await sendEntry(entry);
      if (out.ok) {
        state.result = out.result;
        toast(out.result.duplicate ? 'Already recorded' : 'Batch recorded');
        render();
        load(true);   // resync counts + stock quietly
      } else if (out.retry && kept) {
        state.result = { queued: true, ref: entry.ref, what: entry.what, why: out.error.message };
        render();
      } else {
        btn.disabled = false; btn.textContent = 'Record batch';
        failed(entry.what + ' NOT recorded', out.error, 'pot:' + payload.species_id,
               'Tap Record batch again — the form keeps your entries until you leave this species.');
      }
    };
  }

  function wireGuidanceEdit(sid) {
    $('ge-cancel').onclick = () => { state.editGuidance = false; render(); };
    $('ge-save').onclick = async () => {
      const btn = $('ge-save');
      btn.disabled = true; btn.textContent = 'Saving…';
      try {
        const data = await postAction({
          action: 'upsert_guidance',
          species_id: sid,
          mix_material_id: trim($('ge-mix').value),
          fert_note: trim($('ge-fert').value),
          container_progression: trim($('ge-prog').value),
          season_note: trim($('ge-season').value),
          note: trim($('ge-note').value),
          confirmed_by: ME
        });
        const r = data.result || {};
        if (r.status === 'error') throw new Error(r.message || r.code);
        clearFails('guide:' + sid);
        toast('Exceptions saved');
        state.editGuidance = false;
        await load(true);
        render();
      } catch (e) {
        btn.disabled = false; btn.textContent = 'Save exceptions';
        failed(spName(sid) + ': exceptions NOT saved', e, 'guide:' + sid);
      }
    };
    const clr = $('ge-clear');
    if (clr) clr.onclick = async () => {
      clr.disabled = true;
      try {
        await postAction({ action: 'clear_guidance', species_id: sid, confirmed_by: ME });
        clearFails('guide:' + sid);
        toast('Back to house default');
        state.editGuidance = false;
        await load(true);
        render();
      } catch (e) {
        clr.disabled = false;
        failed(spName(sid) + ': reset to house default NOT saved', e, 'guide:' + sid);
      }
    };
  }

  // ── supplies tab ───────────────────────────────────────────────────────────
  function supplyRowHtml(s) {
    const chips = [];
    if (s.below_reorder) chips.push('<span class="tag low">low</span>');
    if (s.uncounted) chips.push('<span class="tag uncounted">uncounted</span>');
    if (s.open_task_id) chips.push('<span class="tag task">task #' + s.open_task_id + '</span>');
    let h = '<div class="sup-row' + (s.below_reorder ? ' low' : '') + '" data-sup="' + esc(s.supply_id) + '">';
    h += '<div class="top"><div class="nm">' + esc(s.label) +
      (s.species_common_name && s.item_kind === 'tag'
        ? '<span class="sci">' + esc(s.species_common_name) + '</span>' : '') +
      '</div>' + chips.join('') +
      '<div class="cnt">' + (s.on_hand == null ? '—' : s.on_hand) +
      ' <small>' + esc(s.unit) +
      (s.reorder_point != null ? ' · reorder at ' + s.reorder_point : '') + '</small></div></div>';
    if (state.expanded === s.supply_id) {
      h += '<div class="sup-edit">' +
        '<div class="row"><label>Recount to</label><input type="number" min="0" inputmode="numeric" id="se-count">' +
        '<button type="button" id="se-recount">Save count</button></div>' +
        '<div class="row"><label>Received</label><input type="number" min="1" inputmode="numeric" id="se-recv">' +
        '<button type="button" id="se-receive">Add</button></div>' +
        '<div class="row"><label>Reorder at</label><input type="number" min="0" inputmode="numeric" id="se-rp" value="' +
        (s.reorder_point == null ? '' : s.reorder_point) + '">' +
        '<button type="button" id="se-setrp">Set</button></div></div>';
    }
    h += '</div>';
    return h;
  }

  function renderSupplies() {
    const el = $('tab-supplies');
    const sup = (state.data.supplies || []).slice();
    if (!sup.length) { el.innerHTML = '<div class="msg">No supplies yet.</div>'; return; }
    const low = sup.filter(s => s.below_reorder);
    const uncounted = sup.filter(s => !s.below_reorder && s.uncounted);
    const rest = sup.filter(s => !s.below_reorder && !s.uncounted);
    const byKind = { pot: [], media: [], tag: [] };
    rest.forEach(s => (byKind[s.item_kind] = byKind[s.item_kind] || []).push(s));
    let h = '';
    if (low.length) h += '<div class="kindhead">Below reorder point</div>' + low.map(supplyRowHtml).join('');
    if (uncounted.length) h += '<div class="kindhead">Uncounted — tap to count</div>' + uncounted.map(supplyRowHtml).join('');
    [['pot', 'Pots'], ['media', 'Media'], ['tag', 'Tags']].forEach(([k, label]) => {
      if (byKind[k] && byKind[k].length) h += '<div class="kindhead">' + label + '</div>' + byKind[k].map(supplyRowHtml).join('');
    });
    h += '<div class="actions"><button type="button" class="btn-plain" id="sup-add">Add a supply item</button></div>';
    if (state.addingItem) h += addItemHtml();
    el.innerHTML = h;

    el.querySelectorAll('.sup-row .top').forEach(top => {
      top.onclick = () => {
        const id = top.parentNode.getAttribute('data-sup');
        state.expanded = state.expanded === id ? null : id;
        render();
      };
    });
    if (state.expanded) wireSupplyEdit(state.expanded);
    $('sup-add').onclick = () => { state.addingItem = !state.addingItem; render(); };
    if (state.addingItem) wireAddItem();
  }

  function wireSupplyEdit(supplyId) {
    const doPost = async (payload, okMsg) => {
      try {
        const data = await postAction(payload);
        const r = data.result || {};
        if (r.status === 'error') throw new Error(r.message || r.code);
        clearFails('sup:' + supplyId);
        toast(okMsg);
        state.expanded = null;
        await load(true);
        render();
      } catch (e) { failed(supLabel(supplyId) + ': NOT saved', e, 'sup:' + supplyId); }
    };
    $('se-recount').onclick = () => {
      const v = $('se-count').value;
      if (v === '' || Number(v) < 0) { toast('Enter the count you see', true); return; }
      doPost({ action: 'recount_supply', supply_id: supplyId, new_on_hand: String(parseInt(v, 10)),
               actor: ME }, 'Count saved');
    };
    $('se-receive').onclick = () => {
      const v = parseInt($('se-recv').value, 10) || 0;
      if (v <= 0) { toast('How many came in?', true); return; }
      doPost({ action: 'receive_supply', supply_id: supplyId, qty_delta: String(v), actor: ME },
             'Received +' + v);
    };
    $('se-setrp').onclick = () => {
      const v = $('se-rp').value;
      doPost({ action: 'set_reorder_point', supply_id: supplyId,
               reorder_point: v === '' ? '' : String(parseInt(v, 10)), actor: ME },
             v === '' ? 'Reorder tracking off' : 'Reorder point set');
    };
  }

  function addItemHtml() {
    const containers = state.data.containers || [];
    const mats = state.data.materials || [];
    const species = state.data.species || [];
    return '<div class="card" id="add-item">' +
      '<h3 style="margin-bottom:8px">New supply item</h3>' +
      '<div class="group"><div class="label">Kind</div><select id="ai-kind">' +
      '<option value="pot">Pots (a container type)</option>' +
      '<option value="media">Media (a registered material)</option>' +
      '<option value="tag">Tags (a species)</option></select></div>' +
      '<div class="group" id="ai-wrap-pot"><div class="label">Container</div><select id="ai-container">' +
      containers.map(c => '<option value="' + esc(c.container_id) + '">' + esc(c.container_id) + '</option>').join('') +
      '</select></div>' +
      '<div class="group" id="ai-wrap-media" style="display:none"><div class="label">Material</div><select id="ai-material">' +
      mats.map(m => '<option value="' + esc(m.material_id) + '">' + esc(m.product_name) + '</option>').join('') +
      '</select></div>' +
      '<div class="group" id="ai-wrap-tag" style="display:none"><div class="label">Species</div><select id="ai-species">' +
      species.map(s => '<option value="' + esc(s.species_id) + '">' + esc(s.common_name || s.species_id) + '</option>').join('') +
      '</select></div>' +
      '<div class="half">' +
      '<div class="group"><div class="label">Unit</div><input type="text" id="ai-unit" value="each"></div>' +
      '<div class="group"><div class="label">Reorder at (optional)</div>' +
      '<input type="number" id="ai-rp" min="0" inputmode="numeric"></div></div>' +
      '<div class="actions"><button type="button" class="btn-primary" id="ai-save">Add item</button></div></div>';
  }

  function wireAddItem() {
    $('ai-kind').onchange = () => {
      const k = $('ai-kind').value;
      $('ai-wrap-pot').style.display = k === 'pot' ? '' : 'none';
      $('ai-wrap-media').style.display = k === 'media' ? '' : 'none';
      $('ai-wrap-tag').style.display = k === 'tag' ? '' : 'none';
    };
    $('ai-save').onclick = async () => {
      const k = $('ai-kind').value;
      const payload = {
        action: 'add_supply_item', item_kind: k,
        container_id: k === 'pot' ? $('ai-container').value : '',
        material_id: k === 'media' ? $('ai-material').value : '',
        species_id: k === 'tag' ? $('ai-species').value : '',
        unit: trim($('ai-unit').value) || 'each',
        reorder_point: $('ai-rp').value === '' ? '' : String(parseInt($('ai-rp').value, 10)),
        actor: ME
      };
      try {
        const data = await postAction(payload);
        const r = data.result || {};
        if (r.status === 'error') throw new Error(r.message || r.code);
        clearFails('additem');
        toast('Item added');
        state.addingItem = false;
        await load(true);
        render();
      } catch (e) { failed('New supply item NOT added', e, 'additem'); }
    };
  }

  // ── root render ────────────────────────────────────────────────────────────
  function render() {
    if (!state.data) return;
    renderTabs();
    $('tab-pot').style.display = state.tab === 'pot' ? '' : 'none';
    $('tab-supplies').style.display = state.tab === 'supplies' ? '' : 'none';
    if (state.tab === 'pot') renderPot();
    else renderSupplies();
  }

  window.appLoad = () => load(false).then(flushOutbox);
  renderOutbox();
  // anything left on this phone from last time goes out as soon as we're up
  load(false).then(flushOutbox);
  window.addEventListener('online', () => flushOutbox());
  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState === 'visible') flushOutbox();
  });
  setInterval(() => { if (readOutbox().length) flushOutbox(); }, 30000);
})();
</script>
</body>
</html>
