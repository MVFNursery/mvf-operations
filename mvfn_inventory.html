<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Inventory">
<meta name="theme-color" content="#2d3319">
<link rel="manifest" href="inventory-manifest.json">
<link rel="apple-touch-icon" sizes="180x180" href="apple-touch-inventory.png">
<title>MVFN Inventory</title>
<script src="mvfn-auth.js" data-validate-url="https://megamachine.taile865b6.ts.net:5678/webhook/mvfn-get-stock"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@300;400;500&family=Fraunces:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: 'DM Mono', monospace;
    background: #f5f5f0;
    color: #2d3319;
    min-height: 100vh;
  }
  h1, h2 { font-family: 'Fraunces', serif; }

  .container { max-width: 640px; margin: 0 auto; padding: 20px; }

  header { text-align: center; padding: 20px 0 12px; }
  header h1 { font-size: 2rem; font-weight: 700; }
  header .subtitle { font-size: 0.85rem; color: #5a6b2d; margin-top: 4px; }

  /* Controls */
  .controls { display: flex; gap: 10px; margin: 8px 0 16px; flex-wrap: wrap; }
  .controls input[type="search"] {
    flex: 1 1 180px; padding: 12px; border: 2px solid #d1d5db; border-radius: 6px;
    font-family: 'DM Mono', monospace; font-size: 1rem; background: white;
  }
  .controls input[type="search"]:focus { outline: none; border-color: #5a6b2d; }
  .controls select {
    flex: 0 0 auto; padding: 12px; border: 2px solid #d1d5db; border-radius: 6px;
    font-family: 'DM Mono', monospace; font-size: 0.95rem; background: white;
  }

  .summary { font-size: 0.8rem; color: #5a6b2d; margin-bottom: 14px; }

  /* Add-stock */
  .addbtn {
    display: block; width: 100%; margin: 0 0 14px; padding: 12px; border: 2px dashed #5a6b2d;
    background: #fbfbf6; color: #5a6b2d; border-radius: 8px; font-family: 'Fraunces', serif;
    font-size: 0.95rem; font-weight: 600; cursor: pointer;
  }
  .addform {
    display: none; background: #fbfbf6; border: 2px solid #5a6b2d; border-radius: 8px;
    padding: 14px 16px; margin: 0 0 14px;
  }
  .addform.open { display: block; }
  .addform h2 { font-size: 1rem; margin-bottom: 10px; }
  .addform .row { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 8px; }
  .addform input, .addform select {
    flex: 1 1 120px; padding: 10px; border: 2px solid #d1d5db; border-radius: 6px;
    font-family: 'DM Mono', monospace; font-size: 0.9rem; background: white;
  }
  .addform .flabel { font-size: 0.68rem; text-transform: uppercase; letter-spacing: 0.05em;
    color: #8a8a7a; margin: 4px 0 4px; }
  .addform .speciesnote { font-size: 0.72rem; min-height: 1em; margin: 0 0 8px; }
  .addform .speciesnote.match { color: #047857; }
  .addform .speciesnote.new { color: #b45309; }

  /* Species typeahead. A <datalist> can't do this: it can only offer strings,
     with no way to show provenance or to carry the master's ids back. */
  .addform .tawrap { position: relative; }
  .addform .taresults {
    display: none; position: absolute; z-index: 20; left: 0; right: 0; top: calc(100% + 2px);
    max-height: 46vh; overflow-y: auto; -webkit-overflow-scrolling: touch;
    background: white; border: 2px solid #5a6b2d; border-radius: 6px;
    box-shadow: 0 6px 18px rgba(0,0,0,0.14);
  }
  .addform .taresults.show { display: block; }
  .addform .taitem {
    padding: 10px 12px; border-bottom: 1px solid #eceade; cursor: pointer; line-height: 1.35;
  }
  .addform .taitem:last-child { border-bottom: none; }
  .addform .taitem.active { background: #f2f5e6; }
  .addform .taitem .taname { font-size: 0.86rem; color: #2d3319; }
  .addform .taitem .tasci { font-size: 0.74rem; color: #6b7280; font-style: italic; }
  .addform .taitem .tavia { font-size: 0.68rem; color: #8a8a7a; margin-top: 2px; }
  .addform .tabadge {
    display: inline-block; font-size: 0.6rem; text-transform: uppercase; letter-spacing: 0.05em;
    padding: 1px 6px; border-radius: 10px; margin-left: 6px; vertical-align: 1px;
  }
  .addform .tabadge.carried { background: #dcf0e2; color: #047857; }
  .addform .tabadge.onfile  { background: #eceade; color: #6b6b52; }
  .addform .tabadge.master  { background: #e8e6f5; color: #5b4b9a; }
  .addform .taempty { padding: 10px 12px; font-size: 0.78rem; color: #8a8a7a; }
  /* The results list overlays .speciesnote, so an ambiguity warning has to live
     inside the list or the user never sees the one message that matters. */
  .addform .tawarn {
    padding: 8px 12px; font-size: 0.72rem; line-height: 1.35;
    background: #fdf3e3; color: #92400e; border-bottom: 2px solid #f0c98a;
    position: sticky; top: 0;
  }
  .addform .newspecies { display: none; }
  .addform .newspecies.show { display: block; }
  .addform .nativechk { display: flex; align-items: center; gap: 6px; font-size: 0.8rem;
    color: #5a6b2d; margin: 0 0 8px; }
  .addform .nativechk input { flex: 0 0 auto; }
  .addform .actions { display: flex; gap: 8px; margin-top: 4px; }
  .addform .actions button { flex: 1; padding: 11px; border-radius: 6px; font-weight: 600;
    font-family: 'Fraunces', serif; font-size: 0.92rem; cursor: pointer; }
  .addform .save { border: 2px solid #2d3319; background: #2d3319; color: white; }
  .addform .cancel { border: 2px solid #d1d5db; background: white; color: #2d3319; }

  /* Stock cards */
  .stock-list { display: grid; gap: 10px; }
  .stock-card {
    background: white; border: 2px solid #2d3319; border-radius: 8px; padding: 14px 16px;
    cursor: pointer;
  }
  .stock-card.editing { border-color: #5a6b2d; background: #fbfbf6; }
  .stock-card .name { font-family: 'Fraunces', serif; font-size: 1.1rem; font-weight: 600; }
  .stock-card .sci { font-style: italic; font-size: 0.8rem; color: #5a6b2d; margin-top: 2px; }
  .stock-card .meta {
    display: flex; flex-wrap: wrap; gap: 8px 14px; align-items: center;
    margin-top: 10px; font-size: 0.8rem; color: #2d3319;
  }
  .stock-card .meta .qty { font-weight: 500; }
  .stock-card .meta .price { margin-left: auto; font-weight: 500; }
  .stock-card .loc { font-size: 0.72rem; color: #8a8a7a; margin-top: 6px; }

  .badge {
    font-size: 0.68rem; text-transform: uppercase; letter-spacing: 0.04em;
    padding: 2px 8px; border-radius: 999px; border: 1px solid currentColor; font-weight: 500;
  }
  .badge.for-sale { color: #047857; }
  .badge.growing { color: #b45309; }
  .badge.other   { color: #6b7280; }
  .native-dot { color: #047857; font-size: 0.72rem; }

  /* Archived (closed-out) rows — collapsed section below the live list */
  details.archived { margin-top: 18px; }
  details.archived summary {
    cursor: pointer; font-family: 'Fraunces', serif; font-weight: 600;
    font-size: 0.95rem; color: #8a8a7a; padding: 8px 2px;
  }
  details.archived .stock-list { margin-top: 10px; }
  .stock-card.closed { opacity: 0.65; border-style: dashed; cursor: default; }
  .stock-card.closed .closeinfo { font-size: 0.72rem; color: #8a8a7a; margin-top: 8px; }
  .stock-card.closed button.reopen {
    margin-top: 10px; padding: 8px 14px; border: 2px solid #8a8a7a; background: white;
    color: #2d3319; border-radius: 6px; font-family: 'Fraunces', serif; font-size: 0.8rem;
    font-weight: 600; cursor: pointer;
  }
  .editor button.closeout {
    padding: 9px 12px; border: 2px solid #7f1d1d; background: white; color: #7f1d1d;
    border-radius: 6px; font-family: 'Fraunces', serif; font-size: 0.8rem; font-weight: 600;
    cursor: pointer;
  }
  .editor .closehint { font-size: 0.7rem; color: #8a8a7a; }

  /* Inline editor (inside card, shown when the card is tapped) */
  .editor { display: none; margin-top: 12px; border-top: 1px dashed #d1d5db; padding-top: 12px; }
  .stock-card.editing .editor { display: block; }
  .editor .line { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; flex-wrap: wrap; }
  .editor label { font-size: 0.72rem; color: #5a6b2d; min-width: 64px; }
  .editor input.count {
    width: 84px; padding: 10px; border: 2px solid #2d3319; border-radius: 6px;
    font-family: 'DM Mono', monospace; font-size: 1.05rem; text-align: center; background: white;
  }
  .editor button.step {
    width: 44px; height: 44px; padding: 0; border: 2px solid #2d3319; background: white;
    color: #2d3319; border-radius: 6px; font-family: 'DM Mono', monospace; font-size: 1.4rem;
    font-weight: 500; line-height: 1; cursor: pointer;
    touch-action: manipulation; user-select: none; -webkit-user-select: none;
  }
  .editor button.step:active { background: #2d3319; color: white; }
  .editor .delta {
    min-width: 2.6em; text-align: center; font-size: 0.9rem; font-weight: 500;
    color: #8a8a7a;
  }
  .editor .delta.neg { color: #b91c1c; }
  .editor .delta.pos { color: #047857; }
  .editor input.locinput {
    flex: 1 1 120px; padding: 9px; border: 2px solid #d1d5db; border-radius: 6px;
    font-family: 'DM Mono', monospace; font-size: 0.85rem; background: white;
  }
  .editor select.statussel {
    padding: 9px; border: 2px solid #d1d5db; border-radius: 6px;
    font-family: 'DM Mono', monospace; font-size: 0.85rem; background: white;
  }
  .editor button.save {
    padding: 10px 16px; border: 2px solid #2d3319; background: #2d3319; color: white;
    border-radius: 6px; font-family: 'Fraunces', serif; font-size: 0.88rem; font-weight: 600;
    cursor: pointer;
  }
  .editor button.save:disabled { opacity: 0.5; }
  .editor .msg { font-size: 0.72rem; min-height: 1em; }
  .editor .msg.ok { color: #047857; }
  .editor .msg.err { color: #7f1d1d; }
  .editor .msg.saving { color: #8a8a7a; }

  /* States */
  .state { text-align: center; padding: 48px 20px; color: #5a6b2d; }
  .state.error { color: #7f1d1d; }
  .state button {
    margin-top: 16px; padding: 12px 24px; border: 2px solid #2d3319; background: #2d3319;
    color: white; border-radius: 8px; font-family: 'Fraunces', serif; font-size: 1rem;
    font-weight: 600; cursor: pointer;
  }
  .updated { text-align: center; font-size: 0.7rem; color: #aaa; padding: 24px 0 12px; }

  /* Save confirmation toast (centered splash, auto-dismisses in 3s) */
  .toast {
    display: none; position: fixed; inset: 0; z-index: 1000;
    align-items: center; justify-content: center;
    background: rgba(45, 51, 25, 0.28);
  }
  .toast.show { display: flex; }
  .toast-card {
    background: white; border: 2px solid #047857; border-radius: 14px;
    padding: 26px 30px; text-align: center; min-width: 200px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.18);
    animation: toastpop .18s ease-out;
  }
  @keyframes toastpop { from { transform: scale(.9); opacity: 0; } to { transform: scale(1); opacity: 1; } }
  .toast-check {
    width: 56px; height: 56px; margin: 0 auto 12px; border-radius: 50%;
    background: #047857; color: white; font-size: 2rem; line-height: 56px;
  }
  .toast-msg { font-family: 'Fraunces', serif; font-size: 1.15rem; font-weight: 600; color: #2d3319; }
  .toast-ok {
    margin-top: 16px; padding: 9px 28px; border: 2px solid #2d3319; background: white;
    color: #2d3319; border-radius: 999px; font-family: 'Fraunces', serif; font-size: 0.95rem;
    font-weight: 600; cursor: pointer;
  }

  /* Reason modal — one-tap explanation when a count changes */
  .rmodal {
    display: none; position: fixed; inset: 0; z-index: 1100;
    align-items: flex-end; justify-content: center;
    background: rgba(45, 51, 25, 0.35);
  }
  .rmodal.show { display: flex; }
  .rmodal-card {
    background: white; border: 2px solid #2d3319; border-radius: 14px 14px 0 0;
    padding: 20px 20px 26px; width: 100%; max-width: 640px;
    box-shadow: 0 -8px 30px rgba(0,0,0,0.2);
    animation: toastpop .15s ease-out;
  }
  .rmodal-title { font-family: 'Fraunces', serif; font-size: 1.1rem; font-weight: 600; }
  .rmodal-sub { font-size: 0.8rem; color: #5a6b2d; margin-top: 2px; }
  .rmodal-q { font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.05em;
    color: #8a8a7a; margin: 14px 0 8px; }
  .rmodal-opts { display: grid; gap: 8px; }
  .rmodal-opts button {
    padding: 13px 14px; border: 2px solid #2d3319; background: white; color: #2d3319;
    border-radius: 8px; font-family: 'Fraunces', serif; font-size: 0.95rem; font-weight: 600;
    cursor: pointer; text-align: left;
  }
  .rmodal-opts button.sel { background: #2d3319; color: white; }
  .rmodal-opts button:disabled { opacity: 0.5; }
  .rmodal-detail { margin-top: 10px; }
  .rmodal-detail .preview { font-size: 0.8rem; color: #047857; padding: 8px 2px; }
  .rmodal-detail .preview.warn { color: #b45309; }
  .rmodal-detail input, .rmodal-detail textarea {
    width: 100%; padding: 10px; border: 2px solid #d1d5db; border-radius: 6px;
    font-family: 'DM Mono', monospace; font-size: 0.9rem; background: white; margin-top: 6px;
  }
  .rmodal-actions { display: flex; gap: 8px; margin-top: 14px; }
  .rmodal-actions button {
    flex: 1; padding: 12px; border-radius: 8px; font-family: 'Fraunces', serif;
    font-size: 0.95rem; font-weight: 600; cursor: pointer;
  }
  .rmodal-actions .cancel { border: 2px solid #d1d5db; background: white; color: #2d3319; }
  .rmodal-actions .confirm { border: 2px solid #2d3319; background: #2d3319; color: white; }
  .rmodal-actions .confirm:disabled { opacity: 0.5; }
  .rmodal-msg { font-size: 0.75rem; color: #7f1d1d; min-height: 1em; margin-top: 8px; }
</style>
</head>
<body>
  <div class="container">
    <header>
      <h1>MVFN Inventory</h1>
      <div class="subtitle">Mountain View Farm Nursery</div>
    </header>

    <div class="controls" id="controls" style="display:none;">
      <input type="search" id="search" placeholder="Search species…" autocomplete="off">
      <select id="statusFilter">
        <option value="all">All statuses</option>
        <option value="for-sale">For sale</option>
        <option value="growing">Growing</option>
      </select>
    </div>
    <div class="summary" id="summary"></div>

    <button class="addbtn" id="addBtn" type="button">+ Add Stock</button>
    <div class="addform" id="addForm">
      <h2>Add Stock</h2>
      <div class="row tawrap">
        <input id="addSpecies" placeholder="Species (type to search)" autocomplete="off"
               autocorrect="off" autocapitalize="none" spellcheck="false">
        <div class="taresults" id="speciesResults"></div>
      </div>
      <div class="speciesnote" id="speciesNote"></div>
      <div class="newspecies" id="newSpecies">
        <div class="row">
          <input id="addSci" placeholder="Scientific name (optional)">
        </div>
        <label class="nativechk"><input type="checkbox" id="addNative"> True PA native</label>
      </div>
      <div class="flabel">Container size &amp; quantity</div>
      <div class="row">
        <input id="addContainer" list="containerList" placeholder="Container size (pick or type)">
        <datalist id="containerList"></datalist>
        <input id="addQty" type="number" inputmode="numeric" min="0" placeholder="Qty">
      </div>
      <div class="flabel">Status · location · price</div>
      <div class="row">
        <select id="addStatus">
          <option value="growing">growing</option>
          <option value="for-sale">for-sale</option>
        </select>
        <input id="addLocation" placeholder="Location">
        <input id="addPrice" type="number" inputmode="decimal" step="0.01" min="0" placeholder="Price">
      </div>
      <div class="flabel">Source</div>
      <div class="row">
        <input id="addSource" list="sourceList" placeholder="Where it came from (pick or type)">
        <datalist id="sourceList"></datalist>
      </div>
      <div class="msg err" id="addMsg" style="font-size:0.72rem;min-height:1em;"></div>
      <div class="actions">
        <button class="cancel" id="addCancel" type="button">Cancel</button>
        <button class="save" id="addSave" type="button">Add stock</button>
      </div>
    </div>

    <div id="list" class="stock-list"></div>

    <details class="archived" id="archivedWrap" style="display:none;">
      <summary id="archivedSummary">Archived</summary>
      <div id="archivedList" class="stock-list"></div>
    </details>

    <div id="state" class="state">Loading stock…</div>
    <div class="updated" id="updated"></div>
  </div>

  <div class="toast" id="toast" role="status" aria-live="polite">
    <div class="toast-card">
      <div class="toast-check">✓</div>
      <div class="toast-msg" id="toastMsg">Saved</div>
      <button class="toast-ok" id="toastOk" type="button">OK</button>
    </div>
  </div>

  <div class="rmodal" id="rmodal" role="dialog" aria-modal="true">
    <div class="rmodal-card">
      <div class="rmodal-title" id="rmTitle"></div>
      <div class="rmodal-sub" id="rmSub"></div>
      <div class="rmodal-q" id="rmQ">What happened?</div>
      <div class="rmodal-opts" id="rmOpts"></div>
      <div class="rmodal-detail" id="rmDetail"></div>
      <div class="rmodal-msg" id="rmMsg"></div>
      <div class="rmodal-actions">
        <button class="cancel" id="rmCancel" type="button">Cancel</button>
        <button class="confirm" id="rmConfirm" type="button" style="display:none;">Confirm</button>
      </div>
    </div>
  </div>

<script>
  // n8n webhook base — same tailnet host the other field PWAs use.
  const N8N_BASE = 'https://megamachine.taile865b6.ts.net:5678/webhook';

  let stock = [];
  let speciesById = {};
  let speciesList = [];
  let containerList = [];

  // The curated PA-native master (species_ref.species, ~1749 rows / ~271 kB).
  // Fetched lazily on first open of the Add Stock form, never on app load — it is
  // only needed while adding, and it is ~4x the size of everything else combined.
  let refSpecies = [];
  let refState = 'idle';   // idle | loading | ready | failed
  // Normalised common names that resolve to MORE THAN ONE species. GBIF lists
  // "Juniper" as a vernacular for Larix laricina, and Juniperus communis is in
  // the master too -- so a picker that auto-resolved "juniper" would quietly
  // book a larch. These names must be disambiguated by hand, never guessed.
  let ambiguousNames = new Set();
  // The row the user actually picked, if any. Free-typed text leaves this null,
  // which is what distinguishes "chose a known plant" from "invented a name".
  let pickedSpecies = null;
  let taMatches = [];
  let taActive = -1;

  const $ = id => document.getElementById(id);

  function speciesKey(v) { return v == null ? '' : String(v); }

  async function load() {
    setState('Loading stock…', false);
    try {
      const res = await fetch(`${N8N_BASE}/mvfn-get-stock`);
      if (!res.ok) throw new Error(`HTTP ${res.status}`);
      const data = await res.json();
      stock = Array.isArray(data.stock) ? data.stock : [];
      speciesById = {};
      speciesList = (data.species || []).slice();
      speciesList.forEach(sp => { speciesById[speciesKey(sp.species_id)] = sp; });
      containerList = (data.containers || []).slice();
      buildContainerDatalist();
      buildSourceDatalist();
      $('controls').style.display = 'flex';
      $('updated').textContent = 'Updated ' + new Date().toLocaleString();
      render();
    } catch (err) {
      $('controls').style.display = 'none';
      $('summary').textContent = '';
      $('list').innerHTML = '';
      setState(`Couldn't reach inventory (${err.message}). Check your Tailscale connection.`, true);
    }
  }

  // POST a write action to the inventory workflow. Tolerant of empty/non-JSON
  // bodies so a server-side error surfaces as a clear message, not a raw
  // "Unexpected end of JSON input" from res.json().
  async function postAction(payload) {
    const res = await fetch(`${N8N_BASE}/mvfn-inventory`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(payload),
    });
    const text = await res.text();
    let data = null;
    try { data = text ? JSON.parse(text) : null; } catch (e) { data = null; }
    if (!res.ok) throw new Error((data && data.message) ? data.message : `server error ${res.status}`);
    if (data === null) throw new Error('empty response — the save may have failed; check and retry');
    return data;
  }

  // Pull the curated master once per session. Failure is not fatal: the form
  // still works against what we carry, it just can't offer anything new.
  async function ensureRefSpecies() {
    if (refState === 'ready' || refState === 'loading') return;
    refState = 'loading';
    onSpeciesInput();
    try {
      const data = await postAction({ action: 'list_ref_species' });
      const res = (data && data.result) || {};
      const rows = res.ref_species || [];
      refSpecies = Array.isArray(rows) ? rows : [];
      ambiguousNames = new Set(Array.isArray(res.ambiguous_names) ? res.ambiguous_names : []);
      refState = refSpecies.length ? 'ready' : 'failed';
    } catch (err) {
      refState = 'failed';
    }
    onSpeciesInput();
  }

  // Canonical containers from inventory.container -> shared datalist (add form + cards).
  // Free typing is still allowed; a never-seen value upserts a new container server-side.
  function buildContainerDatalist() {
    $('containerList').innerHTML = containerList
      .map(c => {
        const lbl = c.nominal_volume ? `${c.container_id} — ${c.nominal_volume}` : c.container_id;
        return `<option value="${esc(c.container_id)}">${esc(lbl)}</option>`;
      }).join('');
  }

  // Sources already in use on stock rows -> datalist suggestions for the add form.
  // Free text is the norm here (vendor / seed lot / order #), so this only helps
  // reuse an existing spelling — anything new is welcome too.
  function buildSourceDatalist() {
    const seen = new Set();
    stock.forEach(s => { const v = (s.source || '').trim(); if (v) seen.add(v); });
    $('sourceList').innerHTML = [...seen].sort((a, b) => a.localeCompare(b))
      // Text content, not just value — Firefox renders the dropdown from the
      // option's label and shows nothing for value-only options.
      .map(v => `<option value="${esc(v)}">${esc(v)}</option>`).join('');
  }

  function setState(msg, isError) {
    const el = $('state');
    el.className = 'state' + (isError ? ' error' : '');
    el.innerHTML = '';
    el.appendChild(document.createTextNode(msg));
    if (isError) {
      const b = document.createElement('button');
      b.textContent = 'Retry';
      b.onclick = load;
      el.appendChild(document.createElement('br'));
      el.appendChild(b);
    }
    el.style.display = msg ? 'block' : 'none';
  }

  function fmtPrice(p) {
    if (p == null || p === '') return '';
    const n = Number(p);
    return isNaN(n) ? '' : '$' + n.toFixed(2).replace(/\.00$/, '');
  }

  function statusClass(s) {
    if (s === 'for-sale') return 'for-sale';
    if (s === 'growing') return 'growing';
    return 'other';
  }

  function render() {
    const q = $('search').value.trim().toLowerCase();
    const statusF = $('statusFilter').value;

    // Closed-out rows (closed_at set) are done forever: they live in a collapsed
    // Archived section, not among the live cards. Search reaches them; the
    // status filter doesn't (their status is just the stage the row died in).
    const all = stock.map(s => ({ s, sp: speciesById[speciesKey(s.species_id)] || {} }));
    const matchesSearch = ({ s, sp }) => {
      if (!q) return true;
      const hay = `${sp.common_name || ''} ${sp.scientific_name || ''} ${s.species_id || ''}`.toLowerCase();
      return hay.includes(q);
    };
    const bySpecies = (a, b) =>
      (a.sp.common_name || a.s.species_id || '').localeCompare(b.sp.common_name || b.s.species_id || '');
    const rows = all
      .filter(({ s }) => !s.closed_at)
      .filter(({ s }) => statusF === 'all' || s.status === statusF)
      .filter(matchesSearch)
      .sort(bySpecies);
    const archived = all.filter(({ s }) => s.closed_at).filter(matchesSearch).sort(bySpecies);

    const live = stock.filter(s => !s.closed_at);
    const archTotal = stock.length - live.length;
    const forSale = live.filter(s => s.status === 'for-sale' && Number(s.quantity) > 0).length;
    const species = new Set(live.map(s => speciesKey(s.species_id))).size;
    $('summary').textContent =
      `${live.length} stock items · ${forSale} for sale · ${species} species`
      + (archTotal ? ` · ${archTotal} archived` : '');

    $('archivedWrap').style.display = archived.length ? '' : 'none';
    $('archivedSummary').textContent =
      `Archived (${archived.length}${archived.length !== archTotal ? ' of ' + archTotal : ''})`;
    $('archivedList').innerHTML = archived.map(({ s, sp }) => archivedCardHTML(s, sp)).join('');
    archived.forEach(({ s }) => wireArchivedCard(s.stock_id));

    if (!rows.length && !archived.length) { setState('No matching stock.', false); $('list').innerHTML = ''; return; }
    setState('', false);

    $('list').innerHTML = rows.map(({ s, sp }) => cardHTML(s, sp)).join('');
    rows.forEach(({ s }) => wireCard(s.stock_id));
  }

  function cardHTML(s, sp) {
    const name = sp.common_name || s.species_id || 'Unknown';
    const sci = sp.scientific_name ? `<div class="sci">${esc(sp.scientific_name)}</div>` : '';
    const native = sp.is_true_native ? '<span class="native-dot" title="True native">● native</span>' : '';
    const price = fmtPrice(s.price_per_unit);
    const loc = s.location ? `<div class="loc">${esc(s.location)}</div>` : '';
    return `<div class="stock-card" data-card="${s.stock_id}">
      <div class="name">${esc(name)} ${native}</div>
      ${sci}
      <div class="meta">
        <span>${esc(s.container_size || '—')}</span>
        <span class="qty">${s.quantity ?? 0} avail</span>
        <span class="badge ${statusClass(s.status)}">${esc(s.status || '—')}</span>
        ${price ? `<span class="price">${price}</span>` : ''}
      </div>
      ${loc}
      ${editorHTML(s)}
    </div>`;
  }

  function archivedCardHTML(s, sp) {
    const name = sp.common_name || s.species_id || 'Unknown';
    const sci = sp.scientific_name ? `<div class="sci">${esc(sp.scientific_name)}</div>` : '';
    const closedDate = s.closed_at ? new Date(s.closed_at).toLocaleDateString() : '';
    return `<div class="stock-card closed" data-arch="${s.stock_id}">
      <div class="name">${esc(name)}</div>
      ${sci}
      <div class="meta">
        <span>${esc(s.container_size || '—')}</span>
        <span class="badge ${statusClass(s.status)}">${esc(s.status || '—')}</span>
      </div>
      <div class="closeinfo">closed ${esc(closedDate)} · ${esc(s.close_reason || '')}</div>
      ${s.notes ? `<div class="loc">${esc(s.notes)}</div>` : ''}
      <button class="reopen" type="button">Reopen</button>
    </div>`;
  }

  function wireArchivedCard(stockId) {
    const card = document.querySelector(`[data-arch="${stockId}"]`);
    if (!card) return;
    const btn = card.querySelector('button.reopen');
    btn.addEventListener('click', async () => {
      if (!confirm('Reopen this stock row? It returns to the live list at qty 0.')) return;
      btn.disabled = true; btn.textContent = 'Reopening…';
      try {
        const data = await postAction({ action: 'reopen_stock', stock_id: stockId });
        if (Number(data.result && data.result.reopened) !== 1) throw new Error('server did not reopen the row');
        showToast('Reopened');
        await load();
      } catch (err) {
        btn.disabled = false; btn.textContent = 'Reopen';
        alert(`Reopen failed: ${err.message}`);
      }
    });
  }

  function editorHTML(s) {
    return `<div class="editor">
      <div class="line">
        <label>Count</label>
        <button class="step" type="button" data-step="-1" aria-label="minus one">−</button>
        <input class="count" type="number" inputmode="numeric" min="0" value="${s.quantity ?? 0}">
        <button class="step" type="button" data-step="1" aria-label="plus one">+</button>
        <span class="delta" data-delta></span>
        <button class="save" type="button" data-act="count">Save count</button>
        <span class="msg" data-msg></span>
      </div>
      <div class="line">
        <label>Cont.</label>
        <input class="continput" list="containerList" type="text" value="${esc(s.container_size || '')}" placeholder="container size">
      </div>
      <div class="line">
        <label>Status</label>
        <select class="statussel">
          ${['growing', 'for-sale'].concat(
            (s.status && s.status !== 'growing' && s.status !== 'for-sale') ? [s.status] : []
          ).map(o => `<option value="${esc(o)}"${o === s.status ? ' selected' : ''}>${esc(o)}</option>`).join('')}
        </select>
        <label>Loc</label>
        <input class="locinput" type="text" value="${esc(s.location || '')}" placeholder="location">
        <button class="save" type="button" data-act="meta">Save</button>
      </div>
      <div class="line closeline" style="${Number(s.quantity ?? 0) === 0 ? '' : 'display:none;'}">
        <button class="closeout" type="button" data-act="close">Close out…</button>
        <span class="closehint">done forever — moves the row to Archived</span>
      </div>
    </div>`;
  }

  function wireCard(stockId) {
    const card = document.querySelector(`[data-card="${stockId}"]`);
    if (!card) return;
    const s = stock.find(x => x.stock_id === stockId);
    const msg = card.querySelector('[data-msg]');

    function setMsg(text, cls) { msg.textContent = text; msg.className = 'msg ' + (cls || ''); }

    // Stepper buttons + running delta vs the saved count, so pulling 12 from a
    // stack of 150 is 12 taps, not mental arithmetic. Delta rebases after save.
    const countInput = card.querySelector('input.count');
    const deltaEl = card.querySelector('[data-delta]');
    function updateDelta() {
      const n = parseInt(countInput.value, 10);
      const d = isNaN(n) ? 0 : n - Number(s.quantity ?? 0);
      deltaEl.textContent = d > 0 ? `+${d}` : d < 0 ? `−${-d}` : '±0';
      deltaEl.className = 'delta' + (d > 0 ? ' pos' : d < 0 ? ' neg' : '');
    }
    card.querySelectorAll('button.step').forEach(b => {
      b.addEventListener('click', () => {
        const cur = parseInt(countInput.value, 10);
        const next = Math.max(0, (isNaN(cur) ? Number(s.quantity ?? 0) : cur) + Number(b.dataset.step));
        countInput.value = next;
        updateDelta();
        setMsg('', '');
      });
    });
    countInput.addEventListener('input', updateDelta);
    updateDelta();

    // Save count. Unchanged count -> plain set_qty (a "verified today" record).
    // Changed count -> reason modal first (moved / culled / new / recount / other),
    // which saves via adjust_qty and can mirror a move onto the counterpart row.
    card.querySelector('[data-act="count"]').addEventListener('click', async () => {
      const val = countInput.value.trim();
      const n = parseInt(val, 10);
      if (val === '' || isNaN(n) || n < 0) { setMsg('Enter a number ≥ 0', 'err'); return; }
      const btn = card.querySelector('[data-act="count"]');
      if (n !== Number(s.quantity ?? 0)) {
        openReasonModal(s, n, {
          onSaved: (result) => {
            s.quantity = n;
            updateDelta();
            setMsg('✓ saved', 'ok');
            card.querySelector('.meta .qty').textContent = `${n} avail`;
            card.querySelector('.closeline').style.display = n === 0 ? '' : 'none';
          },
        });
        return;
      }
      btn.disabled = true; setMsg('Saving…', 'saving');
      try {
        await postAction({ action: 'set_qty', stock_id: stockId, quantity: n });
        s.quantity = n;
        updateDelta();
        setMsg('✓ saved', 'ok');
        showToast(`Count saved · ${n}`);
        card.querySelector('.meta .qty').textContent = `${n} avail`;
        card.querySelector('.closeline').style.display = n === 0 ? '' : 'none';
      } catch (err) {
        setMsg(`✗ ${err.message} — tap to retry`, 'err');
      } finally { btn.disabled = false; }
    });

    // Auto-fill location 'retail' when status flips to for-sale and loc is empty.
    const statusSel = card.querySelector('select.statussel');
    const locInput = card.querySelector('input.locinput');
    statusSel.addEventListener('change', () => {
      if (statusSel.value === 'for-sale' && !locInput.value.trim()) locInput.value = 'retail';
    });

    // Save status / location / container -> set_* (only what changed)
    card.querySelector('[data-act="meta"]').addEventListener('click', async () => {
      const newStatus = statusSel.value;
      const newLoc = locInput.value.trim();
      const newCont = card.querySelector('input.continput').value.trim();
      const btn = card.querySelector('[data-act="meta"]');
      btn.disabled = true; setMsg('Saving…', 'saving');
      try {
        let changed = false;
        if (newStatus !== s.status) {
          await postAction({ action: 'set_status', stock_id: stockId, status: newStatus });
          s.status = newStatus;
          const badge = card.querySelector('.badge');
          badge.textContent = newStatus; badge.className = 'badge ' + statusClass(newStatus);
          changed = true;
        }
        if (newLoc !== (s.location || '')) {
          await postAction({ action: 'set_location', stock_id: stockId, location: newLoc });
          s.location = newLoc;
          changed = true;
        }
        if (newCont !== (s.container_size || '')) {
          await postAction({ action: 'set_container', stock_id: stockId, container_size: newCont });
          s.container_size = newCont;
          card.querySelector('.meta span').textContent = newCont || '—';
          changed = true;
        }
        setMsg(changed ? '✓ saved' : 'no changes', 'ok');
        if (changed) showToast('Saved');
      } catch (err) {
        setMsg(`✗ ${err.message} — tap to retry`, 'err');
      } finally { btn.disabled = false; }
    });

    // Close out — only offered at qty 0; the server re-checks both guards.
    card.querySelector('[data-act="close"]').addEventListener('click', () => openCloseModal(s));
  }

  // ---- Add Stock ----

  // "Chester Thornless Blackberry" -> "chester-thornless-blackberry"
  function slugify(s) {
    return String(s).toLowerCase().trim()
      .replace(/[^a-z0-9]+/g, '-').replace(/^-+|-+$/g, '');
  }

  // Must mirror species_ref.norm_common_name() — the app and the DB have to
  // agree on what "the same name" is, or the ambiguity list won't match.
  function taNorm(s) {
    return String(s == null ? '' : s).toLowerCase()
      .replace(/[^a-z0-9 ]+/g, ' ').replace(/\s+/g, ' ').trim();
  }

  function isAmbiguousName(typed) {
    return ambiguousNames.has(taNorm(typed));
  }

  // One search row per candidate. `carried` rows have an inventory.species
  // record (with or without live stock — has_stock says which); `master` rows
  // are the curated PA-native list. A carried row that is linked to the master
  // is emitted once, as carried, so the same plant never appears twice.
  function taCandidates() {
    const out = [];
    const linkedRefIds = new Set();
    const refById = {};
    // A species row can exist with no live stock (the 4/11 bulk seed, or sold
    // out) — the badge must not say "in stock" for those, so carry the truth.
    const stocked = new Set();
    stock.forEach(r => { if (Number(r.quantity) > 0) stocked.add(speciesKey(r.species_id)); });
    refSpecies.forEach(r => { refById[String(r.species_id)] = r; });
    speciesList.forEach(sp => {
      if (sp.species_ref_id) linkedRefIds.add(String(sp.species_ref_id));
      // A carried row that is linked to the master inherits the master's synonyms.
      // Without this the plants we actually stock are the ONLY ones with no
      // synonym search, because they get deduped out of the master list below --
      // "Tamarack" would fail to find the Larix laricina sitting in the yard.
      const ref = refById[String(sp.species_ref_id || sp.species_id)];
      out.push({
        source: 'carried',
        has_stock: stocked.has(speciesKey(sp.species_id)),
        species_id: sp.species_id,
        species_ref_id: sp.species_ref_id || '',
        common_name: sp.common_name || '',
        scientific_name: sp.scientific_name || (ref ? ref.scientific_name : '') || '',
        alternate_names: (ref && ref.alternate_names) || '',
        // The master's own common name is a synonym too when our retail label
        // differs from it ("Larch" here, "Tamarack" there).
        extra_name: (ref && ref.common_name) || '',
        is_true_native: sp.is_true_native === true,
      });
    });
    refSpecies.forEach(r => {
      // Already carried under this exact key, or linked to from a carried row.
      if (linkedRefIds.has(String(r.species_id))) return;
      if (speciesById[speciesKey(r.species_id)]) return;
      out.push({
        source: 'master',
        species_id: r.species_id,
        species_ref_id: r.species_id,
        common_name: r.common_name || '',
        scientific_name: r.scientific_name || '',
        alternate_names: r.alternate_names || '',
        is_true_native: r.is_true_native === true,
      });
    });
    return out;
  }

  // Rank: exact name beats prefix beats substring; within a tier, what we already
  // carry sorts first, because the overwhelmingly common case is restocking.
  // alternate_names is searched but scored lowest — it is how "tamarack" reaches
  // Larix laricina, and how a tag name reaches the ERA master's preferred name.
  function taSearch(query) {
    const q = taNorm(query);
    if (q.length < 2) return [];
    const scored = [];
    taCandidates().forEach(c => {
      const common = taNorm(c.common_name);
      const sci = taNorm(c.scientific_name);
      const slug = taNorm(c.species_id).replace(/-/g, ' ');
      // Keep each synonym's display spelling alongside its match key, so the row
      // can say WHICH name it hit on. Searching "trumpet" surfacing "Joe Pye
      // Weed" reads as a bug until you can see it matched "Trumpetweed".
      const alts = ((c.alternate_names || '') + ';' + (c.extra_name || ''))
        .split(';')
        .map(d => ({ d: d.trim(), n: taNorm(d) }))
        .filter(a => a.n && a.n !== common);
      const altHit = pred => (alts.find(a => pred(a.n)) || {}).d || '';
      // In a botanical common name the head noun is last and the modifiers lead:
      // "Common Buttonbush" is a buttonbush, "buttonbush dodder" is a dodder. So a
      // match on the trailing word outranks a match on a leading one — otherwise
      // searching "buttonbush" puts a parasitic vine above the shrub you meant.
      const headMatch = common === q || common.endsWith(' ' + q);
      let score = -1, matched = '';
      if (common === q || sci === q) score = 100;
      else if (headMatch) score = 85;
      else if (common.startsWith(q) || sci.startsWith(q)) score = 80;
      else if ((matched = altHit(a => a === q))) score = 70;
      else if (common.includes(q) || sci.includes(q)) score = 50;
      else if (slug.startsWith(q)) score = 45;
      else if ((matched = altHit(a => a.startsWith(q)))) score = 40;
      else if ((matched = altHit(a => a.includes(q)))) score = 25;
      if (score < 0) return;
      if (c.source === 'carried') score += 8;
      scored.push({ c, score, matched });
    });
    scored.sort((a, b) =>
      b.score - a.score ||
      (a.c.common_name || a.c.scientific_name).localeCompare(b.c.common_name || b.c.scientific_name));
    return scored.slice(0, 25).map(x => ({ ...x.c, matched: x.matched }));
  }

  function renderTaResults() {
    const box = $('speciesResults');
    if (!taMatches.length) { box.classList.remove('show'); box.innerHTML = ''; return; }
    const typed = $('addSpecies').value.trim();
    const warn = isAmbiguousName(typed)
      ? `<div class="tawarn">⚠ “${esc(typed)}” is used for more than one plant — check the botanical name before picking.</div>`
      : '';
    box.innerHTML = warn + taMatches.map((c, i) => {
      // Three states: live stock, known-but-empty, master-only. `carried` alone
      // is NOT "in stock" — 43 of the seeded species have never had a stock row.
      const badge = c.source !== 'carried'
        ? '<span class="tabadge master">curated</span>'
        : c.has_stock
          ? '<span class="tabadge carried">in stock</span>'
          : '<span class="tabadge onfile">on file</span>';
      const sci = c.scientific_name ? `<div class="tasci">${esc(c.scientific_name)}</div>` : '';
      // Only when the hit came from a synonym rather than the name on screen.
      const via = c.matched ? `<div class="tavia">matched “${esc(c.matched)}”</div>` : '';
      return `<div class="taitem${i === taActive ? ' active' : ''}" data-i="${i}">
        <div class="taname">${esc(c.common_name || c.species_id)}${badge}</div>${sci}${via}</div>`;
    }).join('');
    box.classList.add('show');
  }

  function hideTaResults() {
    taMatches = []; taActive = -1;
    $('speciesResults').classList.remove('show');
    $('speciesResults').innerHTML = '';
  }

  // Choosing from the list is what carries the master's identity across. Free
  // typing still works, but only a pick can set species_ref_id — which is the
  // whole point: an unlinked species should be a deliberate act, not the default.
  function pickSpecies(c) {
    pickedSpecies = c;
    $('addSpecies').value = c.common_name || c.scientific_name || c.species_id;
    $('addSci').value = c.scientific_name || '';
    $('addNative').checked = !!c.is_true_native;
    hideTaResults();
    updateSpeciesNote();
  }

  function updateSpeciesNote() {
    const typed = $('addSpecies').value.trim();
    const note = $('speciesNote');
    const block = $('newSpecies');
    const set = (txt, cls, showNew) => {
      note.textContent = txt;
      note.className = 'speciesnote' + (cls ? ' ' + cls : '');
      block.classList.toggle('show', showNew);
    };

    if (!typed) { set('', '', false); return; }

    if (pickedSpecies && pickedSpecies.source === 'carried') {
      set(pickedSpecies.has_stock
        ? '✓ already in stock — adding another container/batch'
        : '✓ on file (no live stock) — adding will reuse the existing record',
        'match', false);
      return;
    }
    if (pickedSpecies && pickedSpecies.source === 'master') {
      set(`✚ new to us — will be created as ${pickedSpecies.species_id}, linked to the curated master`, 'match', true);
      return;
    }
    if (refState === 'loading') { set('Loading the curated species list…', '', false); return; }
    if (refState === 'failed') {
      set(`⚠ curated list unavailable — “${typed}” will be created unlinked (${slugify(typed)})`, 'new', true);
      return;
    }
    // The typed name is a real name, but it means more than one plant. Refuse to
    // guess -- show it and make the choice explicit.
    if (isAmbiguousName(typed)) {
      const n = taSearch(typed).length;
      set(`⚠ “${typed}” is used for more than one plant${n ? ` (${n} matches)` : ''} — pick the one you mean from the list`, 'new', false);
      return;
    }
    set(`⚠ no match in the curated list — “${typed}” will be created unlinked (${slugify(typed)}). Pick from the list if you can.`, 'new', true);
  }

  function onSpeciesInput() {
    // Any keystroke invalidates a previous pick — otherwise editing the text
    // after choosing would silently keep the old plant's identity.
    pickedSpecies = null;
    const typed = $('addSpecies').value;
    taMatches = taSearch(typed);
    taActive = -1;
    renderTaResults();
    updateSpeciesNote();
  }

  function onSpeciesKeydown(e) {
    if (!taMatches.length) return;
    if (e.key === 'ArrowDown' || e.key === 'ArrowUp') {
      e.preventDefault();
      taActive += (e.key === 'ArrowDown' ? 1 : -1);
      if (taActive < 0) taActive = taMatches.length - 1;
      if (taActive >= taMatches.length) taActive = 0;
      renderTaResults();
      const el = $('speciesResults').querySelector('.taitem.active');
      if (el) el.scrollIntoView({ block: 'nearest' });
    } else if (e.key === 'Enter' && taActive >= 0) {
      e.preventDefault();
      pickSpecies(taMatches[taActive]);
    } else if (e.key === 'Escape') {
      hideTaResults();
    }
  }

  function resetAddForm() {
    ['addSpecies','addContainer','addQty','addLocation','addPrice','addSci','addSource'].forEach(id => $(id).value = '');
    $('addNative').checked = false;
    $('addMsg').textContent = '';
    $('speciesNote').textContent = ''; $('speciesNote').className = 'speciesnote';
    $('newSpecies').classList.remove('show');
    pickedSpecies = null;
    hideTaResults();
  }

  async function submitAddStock() {
    const typed = $('addSpecies').value.trim();
    const addMsg = $('addMsg');
    if (!typed) { addMsg.textContent = 'Enter a species name.'; return; }
    const qtyRaw = $('addQty').value.trim();
    const qty = qtyRaw === '' ? 0 : parseInt(qtyRaw, 10);
    if (isNaN(qty) || qty < 0) { addMsg.textContent = 'Qty must be ≥ 0.'; return; }

    // Three cases, in order of preference:
    //   carried  -> reuse the existing inventory key, create nothing.
    //   master   -> create using the SCIENTIFIC slug and carry species_ref_id, so
    //               the row is born linked. This is the case that was impossible
    //               before and that produced the 2026-08-04 orphans.
    //   free text-> last resort; slugify the typed name and create it unlinked.
    let speciesId, speciesRefId = '';
    if (pickedSpecies && pickedSpecies.source === 'carried') {
      speciesId = pickedSpecies.species_id;
    } else if (pickedSpecies && pickedSpecies.source === 'master') {
      speciesId = pickedSpecies.species_id;
      speciesRefId = pickedSpecies.species_ref_id || '';
    } else {
      // Free text that happens to be a name shared by several plants is the one
      // case worth blocking outright: slugifying it would mint a species whose
      // name does not identify what is actually in the pot.
      if (isAmbiguousName(typed)) {
        addMsg.textContent = `“${typed}” means more than one plant — pick the one you mean from the list.`;
        onSpeciesInput();
        return;
      }
      speciesId = slugify(typed);
    }
    const isNew = !speciesById[speciesKey(speciesId)];
    if (!speciesId) { addMsg.textContent = 'Species name needs at least one letter or number.'; return; }

    const btn = $('addSave'); btn.disabled = true;
    try {
      if (isNew) {
        addMsg.textContent = 'Creating species…';
        await postAction({
          action: 'add_species',
          species_id: speciesId,
          // Keep the master's common name when one was picked; it is the curated
          // label, and the typed text may be a synonym or a tag name.
          common_name: (pickedSpecies && pickedSpecies.common_name) || typed,
          scientific_name: $('addSci').value.trim(),
          is_true_native: $('addNative').checked ? 'true' : '',
          species_ref_id: speciesRefId,
        });
      }
      addMsg.textContent = 'Adding stock…';
      await postAction({
        action: 'add_stock',
        species_id: speciesId,
        container_size: $('addContainer').value.trim(),
        quantity: String(qty),
        location: $('addLocation').value.trim(),
        status: $('addStatus').value,
        price_per_unit: $('addPrice').value.trim(),
        source: $('addSource').value.trim(),
      });
      resetAddForm();
      $('addForm').classList.remove('open');
      showToast(isNew ? 'Species + stock added' : 'Stock added');
      await load();
    } catch (err) {
      addMsg.textContent = `✗ ${err.message} — tap to retry`;
    } finally { btn.disabled = false; }
  }

  function esc(str) {
    return String(str).replace(/[&<>"']/g, c =>
      ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  }

  // ---- Reason modal (count-change explanation + retail/nursery mirroring) ----
  // Retail = status 'for-sale', nursery = status 'growing'. The counterpart row
  // for a move is same species + same container size on the opposite status;
  // that key is unique in the current grain, so .find() is deterministic.
  function findCounterpart(s, targetStatus) {
    return stock.find(x => x.stock_id !== s.stock_id
      && !x.closed_at                                  // never move stock onto a closed row
      && speciesKey(x.species_id) === speciesKey(s.species_id)
      && (x.container_size || '') === (s.container_size || '')
      && x.status === targetStatus) || null;
  }

  function sideName(status) { return status === 'for-sale' ? 'retail' : 'nursery'; }

  function openReasonModal(s, newQty, { onSaved }) {
    const sp = speciesById[speciesKey(s.species_id)] || {};
    const oldQty = Number(s.quantity ?? 0);
    const delta = newQty - oldQty;                     // >0 = increase
    const isRetail = s.status === 'for-sale';
    const otherStatus = isRetail ? 'growing' : 'for-sale';
    const cp = findCounterpart(s, otherStatus);

    $('rmTitle').textContent = `${sp.common_name || s.species_id || 'Unknown'} · ${s.container_size || '—'}`;
    $('rmSub').textContent =
      `${sideName(s.status)} · ${oldQty} → ${newQty} (${delta > 0 ? '+' : ''}${delta})`;
    $('rmQ').textContent = 'What happened?';       // the close-out modal reuses this dialog
    $('rmMsg').textContent = '';
    $('rmDetail').innerHTML = '';
    $('rmConfirm').style.display = 'none';

    // One-tap options; cull/recount/new save immediately, move/other need Confirm.
    const opts = delta < 0
      ? [
          { key: 'transfer', label: `Moved to ${sideName(otherStatus)}` },
          { key: 'cull',     label: 'Culled' },
          { key: 'recount',  label: 'Recount / correction' },
          { key: 'other',    label: 'Other…' },
        ]
      : [
          { key: 'new',      label: 'New stock (in / potted up / divided)' },
          { key: 'transfer', label: `Moved from ${sideName(otherStatus)}` },
          { key: 'recount',  label: 'Recount / correction' },
          { key: 'other',    label: 'Other…' },
        ];

    $('rmOpts').innerHTML = opts.map(o =>
      `<button type="button" data-reason="${o.key}">${esc(o.label)}</button>`).join('');

    let chosen = null;

    async function submit(reason) {
      const payload = { action: 'adjust_qty', stock_id: s.stock_id, quantity: newQty, reason };
      const noteEl = $('rmDetail').querySelector('textarea');
      if (noteEl && noteEl.value.trim()) payload.notes = noteEl.value.trim();
      if (reason === 'transfer') {
        if (cp) payload.target_stock_id = cp.stock_id;
        else {
          payload.target_status = otherStatus;
          payload.target_location = otherStatus === 'for-sale' ? 'retail' : '';
          const priceEl = $('rmDetail').querySelector('input.rprice');
          if (priceEl && priceEl.value.trim()) payload.target_price = priceEl.value.trim();
        }
      }
      setModalBusy(true);
      try {
        await postAction(payload);
        closeReasonModal();
        onSaved();
        if (reason === 'transfer') {
          showToast(`Saved · ${Math.abs(delta)} ${delta < 0 ? 'to' : 'from'} ${sideName(otherStatus)}`);
          await load();                                // counterpart changed or was created
        } else {
          showToast(`Count saved · ${newQty}`);
        }
      } catch (err) {
        setModalBusy(false);
        $('rmMsg').textContent = `✗ ${err.message} — tap to retry`;
      }
    }

    function setModalBusy(busy) {
      $('rmodal').querySelectorAll('button').forEach(b => b.disabled = busy);
    }

    function showDetail(reason) {
      const det = $('rmDetail');
      if (reason === 'transfer') {
        const moving = Math.abs(delta);
        if (cp) {
          const after = Number(cp.quantity ?? 0) + (oldQty - newQty);
          const clamp = after < 0;
          det.innerHTML = `<div class="preview${clamp ? ' warn' : ''}">${
            delta < 0
              ? `+${moving} → ${esc(sideName(otherStatus))} (${cp.quantity ?? 0} → ${Math.max(0, after)})`
              : `−${moving} from ${esc(sideName(otherStatus))} (${cp.quantity ?? 0} → ${Math.max(0, after)})`
          }${clamp ? ` — ${esc(sideName(otherStatus))} only shows ${cp.quantity ?? 0}, it will be set to 0` : ''}</div>`;
        } else if (delta < 0) {
          det.innerHTML = `<div class="preview">No ${esc(sideName(otherStatus))} entry yet — one will be created (+${moving})</div>`
            + (otherStatus === 'for-sale'
              ? `<input class="rprice" type="number" inputmode="decimal" step="0.01" min="0" placeholder="Price (optional)">`
              : '');
        } else {
          det.innerHTML = `<div class="preview warn">No ${esc(sideName(otherStatus))} entry for this species + container — nothing to move from. Pick another reason, or fix that side first.</div>`;
          $('rmConfirm').style.display = 'none';
          return false;
        }
        return true;
      }
      if (reason === 'other') {
        det.innerHTML = `<textarea rows="2" placeholder="What happened?"></textarea>`;
        return true;
      }
      det.innerHTML = '';
      return true;
    }

    $('rmOpts').querySelectorAll('button').forEach(btn => {
      btn.addEventListener('click', () => {
        const reason = btn.getAttribute('data-reason');
        chosen = reason;
        $('rmOpts').querySelectorAll('button').forEach(b => b.classList.toggle('sel', b === btn));
        $('rmMsg').textContent = '';
        if (reason === 'cull' || reason === 'recount' || reason === 'new') { submit(reason); return; }
        const ok = showDetail(reason);
        $('rmConfirm').style.display = ok ? '' : 'none';
      });
    });

    $('rmConfirm').onclick = () => { if (chosen) submit(chosen); };
    $('rmCancel').onclick = closeReasonModal;
    setModalBusy(false);            // never inherit a disabled state from a prior submit
    $('rmodal').classList.add('show');
  }

  function closeReasonModal() {
    $('rmodal').classList.remove('show');
    $('rmodal').querySelectorAll('button').forEach(b => b.disabled = false);
  }

  // ---- Close-out modal (reuses the reason-modal dialog) ----
  // Closure is a column pair (closed_at + close_reason), NOT a status: the row
  // keeps the stage it died in and moves to the Archived section. The reason
  // taxonomy is closed — it must match the server's guard list exactly.
  const CLOSE_REASONS = [
    { key: 'mistake',              label: 'Mistake — row never should have existed' },
    { key: 'container-phased-out', label: 'Container phased out' },
    { key: 'superseded-by-split',  label: 'Superseded by a split' },
    { key: 'snapshot-period-end',  label: 'Period-end snapshot leftover' },
  ];

  function openCloseModal(s) {
    const sp = speciesById[speciesKey(s.species_id)] || {};
    $('rmTitle').textContent = `${sp.common_name || s.species_id || 'Unknown'} · ${s.container_size || '—'}`;
    $('rmSub').textContent = 'Close out forever — moves to Archived (reopenable)';
    $('rmQ').textContent = 'Why is this row done for good?';
    $('rmMsg').textContent = '';
    $('rmDetail').innerHTML = '';
    $('rmConfirm').style.display = 'none';
    $('rmOpts').innerHTML = CLOSE_REASONS.map(o =>
      `<button type="button" data-reason="${o.key}">${esc(o.label)}</button>`).join('');

    let chosen = null;
    $('rmOpts').querySelectorAll('button').forEach(btn => {
      btn.addEventListener('click', () => {
        chosen = btn.getAttribute('data-reason');
        $('rmOpts').querySelectorAll('button').forEach(b => b.classList.toggle('sel', b === btn));
        $('rmMsg').textContent = '';
        $('rmDetail').innerHTML = `<textarea rows="2" placeholder="Note (optional)"></textarea>`;
        $('rmConfirm').style.display = '';
      });
    });

    $('rmConfirm').onclick = async () => {
      if (!chosen) return;
      const payload = { action: 'close_stock', stock_id: s.stock_id, reason: chosen };
      const noteEl = $('rmDetail').querySelector('textarea');
      if (noteEl && noteEl.value.trim()) payload.note = noteEl.value.trim();
      $('rmodal').querySelectorAll('button').forEach(b => b.disabled = true);
      try {
        const data = await postAction(payload);
        // The server refuses (closed=0) unless the row is still open AND at qty 0.
        if (Number(data.result && data.result.closed) !== 1) {
          throw new Error('row not closed — it must be at 0 and still open (refresh and retry)');
        }
        closeReasonModal();
        showToast('Closed out');
        await load();
      } catch (err) {
        $('rmodal').querySelectorAll('button').forEach(b => b.disabled = false);
        $('rmMsg').textContent = `✗ ${err.message}`;
      }
    };
    $('rmCancel').onclick = closeReasonModal;
    $('rmodal').querySelectorAll('button').forEach(b => b.disabled = false);
    $('rmodal').classList.add('show');
  }

  // Centered checkmark confirmation; auto-dismisses after 3s, OK/backdrop dismiss early.
  let toastTimer = null;
  function showToast(msg) {
    $('toastMsg').textContent = msg || 'Saved';
    $('toast').classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(hideToast, 3000);
  }
  function hideToast() { clearTimeout(toastTimer); $('toast').classList.remove('show'); }

  $('search').addEventListener('input', render);
  $('statusFilter').addEventListener('change', render);
  // Tap a card to expand/collapse its inline editor; ignore taps inside the
  // editor itself so typing / hitting Save doesn't toggle the card.
  $('list').addEventListener('click', (e) => {
    const card = e.target.closest('.stock-card');
    if (!card) return;
    if (e.target.closest('.editor')) return;
    card.classList.toggle('editing');
  });
  // Opening the form is the trigger for pulling the curated master — early enough
  // that it is loaded before the first keystroke lands, late enough that browsing
  // stock never pays for it.
  $('addBtn').addEventListener('click', () => {
    const open = $('addForm').classList.toggle('open');
    if (open) ensureRefSpecies();
  });
  $('addCancel').addEventListener('click', () => { $('addForm').classList.remove('open'); resetAddForm(); });
  $('addSpecies').addEventListener('input', onSpeciesInput);
  $('addSpecies').addEventListener('keydown', onSpeciesKeydown);
  $('addSpecies').addEventListener('focus', () => { ensureRefSpecies(); onSpeciesInput(); });
  // mousedown, not click: it fires before the input's blur, so the pick isn't
  // cancelled by the list closing out from under the tap.
  $('speciesResults').addEventListener('mousedown', e => {
    const item = e.target.closest('.taitem');
    if (!item) return;
    e.preventDefault();
    pickSpecies(taMatches[Number(item.dataset.i)]);
  });
  $('addSpecies').addEventListener('blur', () => setTimeout(hideTaResults, 150));
  $('addStatus').addEventListener('change', () => {
    if ($('addStatus').value === 'for-sale' && !$('addLocation').value.trim()) $('addLocation').value = 'retail';
  });
  $('addSave').addEventListener('click', submitAddStock);
  $('toastOk').addEventListener('click', hideToast);
  $('toast').addEventListener('click', e => { if (e.target.id === 'toast') hideToast(); });
  load();
</script>
</body>
</html>
